<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bootzooka Map</title>
<style>
/* Layout: one-line header with tabs; Map = search + layer filter over a width-fitted layered SVG, with a side card
   (a bottom sheet on phones); Flows = grouped flow list, header grid, fitted sequence lanes over a request/response inspector. */
:root {
  --bg: #f4f6f8; --surface: #ffffff; --surface-2: #e9edf2; --line: #d3dae3;
  --fg: #16202c; --fg-dim: #556373; --accent: #0f6b5c;
  --back: #1d5fa8; --back-soft: #dcecfb; --lay: #a8326a; --lay-soft: #fbe3ee;
  --async: #6e5510; --async-soft: #f6edcf; --note: #556373;
  --ok: #1f7a43; --warn: #9a6400; --shadow: 0 10px 30px rgba(22, 32, 44, 0.18);
  --font-display: 'Archivo', 'Arial Narrow', system-ui, sans-serif;
  --font-body: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e141b; --surface: #151d27; --surface-2: #1d2733; --line: #2b3746;
  --fg: #e3e9f0; --fg-dim: #94a3b4; --accent: #4cc3a9;
  --back: #6aaef0; --back-soft: #16304a; --lay: #ee7fae; --lay-soft: #42182c;
  --async: #e2c25e; --async-soft: #3a3115; --note: #94a3b4;
  --ok: #5fd08f; --warn: #e5b04c; --shadow: 0 10px 30px rgba(0, 0, 0, 0.55); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e141b; --surface: #151d27; --surface-2: #1d2733; --line: #2b3746;
  --fg: #e3e9f0; --fg-dim: #94a3b4; --accent: #4cc3a9;
  --back: #6aaef0; --back-soft: #16304a; --lay: #ee7fae; --lay-soft: #42182c;
  --async: #e2c25e; --async-soft: #3a3115; --note: #94a3b4;
  --ok: #5fd08f; --warn: #e5b04c; --shadow: 0 10px 30px rgba(0, 0, 0, 0.55); color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
html { font-size: clamp(15px, 0.35vw + 11px, 19px); } /* 15px phones, 16px at 1440, ~17.7px at 1920, 19px on 2560+ */
body { margin: 0; background: var(--bg); color: var(--fg); font: 1rem/1.5 var(--font-body); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, .mono { font-family: var(--font-mono); font-size: 0.86em; }
a { color: var(--accent); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: 8px; top: -40px; z-index: 50; background: var(--surface); padding: 6px 10px; border-radius: 6px; box-shadow: var(--shadow); }
.skip:focus { top: 8px; }

.app { display: flex; flex-direction: column; height: 100%; }

/* ---------- header ---------- */
.topbar { display: grid; grid-template-columns: auto 1fr auto; grid-template-areas: "brand tabs theme"; align-items: center; gap: 8px 16px;
  padding: 8px 16px; padding-top: calc(8px + env(safe-area-inset-top, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { grid-area: brand; display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { margin: 0; font: 800 1.2667rem/1.1 var(--font-display); white-space: nowrap; }
.verified { font-size: 0.8rem; color: var(--fg-dim); white-space: nowrap; }
.verified b { color: var(--ok); font-weight: 600; }
.tabs { grid-area: tabs; display: flex; gap: 2px; justify-content: flex-end; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 1px solid transparent; background: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; color: var(--fg-dim); font-weight: 600; white-space: nowrap; }
.tab:hover { color: var(--fg); background: var(--surface-2); }
.tab[aria-selected="true"] { color: var(--fg); border-color: var(--line); background: var(--bg); }
.themebtn { grid-area: theme; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 10px; cursor: pointer; color: var(--fg); font-size: 0.8667rem; line-height: 1.3; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
.btn.ghost { border-color: transparent; background: none; color: var(--fg-dim); }
.btn.ghost:hover { color: var(--fg); background: var(--surface-2); }

.view { flex: 1; min-height: 0; display: none; }
.view.active { display: flex; }

/* ---------- map ---------- */
#view-map { flex-direction: row; }
.map-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.map-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
.combo { position: relative; flex: 0 1 300px; min-width: 200px; }
.combo input { width: 100%; padding: 7px 10px 7px 30px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.combo svg.mag { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; stroke: var(--fg-dim); fill: none; pointer-events: none; }
.combo ul { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); max-height: 320px; overflow-y: auto; }
.combo li { padding: 6px 8px; border-radius: 5px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.combo li[aria-selected="true"], .combo li:hover { background: var(--surface-2); }
.combo li .sw { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; transform: translateY(1px); }
.combo li small { color: var(--fg-dim); }
.chips { display: flex; gap: 6px; flex: 1 1 400px; min-width: 0; flex-wrap: wrap; align-items: center; }
.chips-label { font: 700 0.7rem var(--font-display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-dim); margin-right: 2px; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 3px 10px; border-radius: 999px; cursor: pointer; font-size: 0.8333rem; display: inline-flex; align-items: center; gap: 6px; color: var(--fg-dim); white-space: nowrap; }
.chip .sw { width: 9px; height: 9px; border-radius: 2px; }
.chip[aria-pressed="true"] { color: var(--fg); border-color: var(--fg-dim); }
.chip[aria-pressed="false"] { text-decoration: line-through; opacity: 0.7; }
.map-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; }
.map-hint { padding: 6px 16px 0; font-size: 0.8333rem; color: var(--fg-dim); }
svg text { fill: var(--fg); font-family: var(--font-body); }
.layer-label { font: 700 0.7rem var(--font-display); letter-spacing: 0.12em; text-transform: uppercase; fill: var(--fg-dim); }
.layer-band { fill: var(--surface); stroke: var(--line); }
.node rect.box { fill: var(--surface); stroke-width: 1.5; }
.node { cursor: pointer; outline: none; }
.node text.nl { font-weight: 600; font-size: 0.8333rem; }
.node text.ns { font-size: 0.7rem; fill: var(--fg-dim); }
.node.dim { opacity: 0.22; }
.node.sel rect.box { stroke-width: 3; }
.node:focus-visible rect.box { stroke: var(--accent); stroke-width: 3; }
.node:hover rect.box { fill: var(--surface-2); }
.edge { fill: none; stroke: var(--fg-dim); stroke-width: 1; opacity: 0.09; transition: opacity .15s; }
.edge.hi { opacity: 0.85; stroke-width: 1.8; }
.edge.out.hi { stroke: var(--back); }
.edge.in.hi { stroke: var(--lay); }
.edge.dim { opacity: 0.03; }
.edge.focus { opacity: 1; stroke-width: 3.2; }
.edge.fp { stroke: var(--accent); opacity: 0.95; stroke-width: 2.4; }
.edge.cond { stroke-dasharray: 6 4; }
.node.cond .box { stroke-dasharray: 6 4; }
.cond-note { font-size: 0.82rem; color: var(--warn); }
.badge circle { fill: var(--accent); }
.badge text { fill: var(--surface); font-weight: 700; text-anchor: middle; }
.flowbanner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 0.9rem; }
.flowbanner b { font-family: var(--font-display); }
.flowbanner .note { flex: 1 1 260px; }
.stepslist { list-style: none; margin: 8px 0 0; padding: 0; counter-reset: s; display: grid; gap: 2px; }
.stepslist button { width: 100%; display: grid; grid-template-columns: 2em 1fr; gap: 0 6px; text-align: left; border: 0; background: none; padding: 6px 6px; border-radius: 6px; cursor: pointer; }
.stepslist button:hover { background: var(--surface-2); }
.stepslist .n { font: 600 0.75rem var(--font-mono); color: var(--fg-dim); padding-top: 2px; }
.stepslist .l { font-weight: 600; }
.stepslist .h { grid-column: 2; font-size: 0.8rem; color: var(--fg-dim); }
.qa { display: grid; gap: 8px; }
.qa .it { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: baseline; }
.qa .k { font: 600 0.7rem var(--font-mono); text-transform: uppercase; letter-spacing: 0.04em; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); color: var(--ok); }
.qa .nm { font-family: var(--font-mono); font-size: 0.85rem; font-weight: 600; word-break: break-all; }
.qa .nt { grid-column: 2; font-size: 0.82rem; color: var(--fg-dim); }
.qa .ev { grid-column: 2; margin: 0; }

.side { width: var(--side-w, 26rem); flex-shrink: 0; border-left: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding: 18px 18px 40px; }
.side-head { display: flex; align-items: flex-start; gap: 8px; }
.side-head > div { flex: 1; min-width: 0; }
.side h2 { font: 800 1.4rem/1.15 var(--font-display); margin: 0 0 4px; text-wrap: balance; }
.side .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 0.8333rem; color: var(--fg-dim); }
.layerpill { display: inline-flex; align-items: center; gap: 5px; }
.layerpill .sw { width: 9px; height: 9px; border-radius: 2px; }
.side p { margin: 10px 0; }
.sheet-close { display: none; }
.sec-t { font: 700 0.7rem var(--font-display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-dim); margin: 18px 0 6px; }
.rel { display: grid; grid-template-columns: auto 1fr; gap: 0 10px; font-size: 0.9rem; align-items: baseline; }
.rel .row { display: contents; }
.rel .p { font-family: var(--font-mono); font-size: 0.7333rem; padding: 1px 6px; border-radius: 4px; white-space: nowrap; margin-top: 4px; }
.rel .p.out { background: var(--back-soft); color: var(--back); }
.rel .p.in { background: var(--lay-soft); color: var(--lay); }
.rel button.lnk { background: none; border: 0; padding: 4px 0 0; cursor: pointer; color: var(--accent); font-weight: 600; text-align: left; }
.rel button.lnk:hover { text-decoration: underline; }
.rel .why { color: var(--fg-dim); font-size: 0.8333rem; grid-column: 2; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 0.7667rem; padding: 1px 7px; border-radius: 4px; background: var(--surface-2); color: var(--fg-dim); font-family: var(--font-mono); }
.links { margin: 4px 0 0; padding-left: 18px; }
.links li { margin: 2px 0; }
.facts { padding-left: 18px; }
.facts li { margin: 0 0 12px; }
.callout { border-left: 3px solid var(--warn); background: var(--surface-2); padding: 8px 12px; border-radius: 0 6px 6px 0; font-size: 0.9rem; margin: 10px 0; }
.note { font-size: 0.8667rem; color: var(--fg-dim); }
details.conn summary { cursor: pointer; }
details.conn .c { margin-top: 10px; font-size: 0.8333rem; }

.ev { font-size: 0.8rem; margin: 6px 0; }
.ev a { font-family: var(--font-mono); font-size: 0.7667rem; word-break: break-all; text-decoration: none; }
.ev a:hover { text-decoration: underline; }
.ev a .repo { color: var(--fg-dim); }
.ev q { display: block; quotes: none; font-family: var(--font-mono); font-size: 0.7667rem; color: var(--fg-dim); background: var(--surface-2); padding: 4px 8px; border-radius: 4px; margin-top: 2px; white-space: pre-wrap; word-break: break-word; }

.intro h2 { color: var(--fg); }

/* ---------- flows ---------- */
#view-flows { flex-direction: row; }
.flowlist { width: var(--list-w, 16.5rem); flex-shrink: 0; border-right: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding: 8px 10px 20px; }
.fl-group { font: 700 0.7rem var(--font-display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-dim); margin: 12px 10px 4px; }
.flowlist button { display: grid; grid-template-columns: 22px 1fr; column-gap: 6px; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.flowlist button:hover { background: var(--surface-2); }
.flowlist button[aria-current="true"] { background: var(--surface-2); box-shadow: inset 3px 0 0 var(--accent); }
.flowlist .num { grid-row: span 2; font: 700 0.7333rem var(--font-mono); color: var(--fg-dim); padding-top: 2px; }
.flowlist .ft { font-weight: 600; }
.flowlist .fs { font-size: 0.8333rem; color: var(--fg-dim); line-height: 1.35; }
.flowpick { display: none; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.flowpick select { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.flow-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.flow-head { padding: 12px 18px; background: var(--surface); border-bottom: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; align-items: center; }
.flow-head h2 { margin: 0; font: 800 1.3333rem/1.2 var(--font-display); text-wrap: balance; }
.ctrls { display: flex; gap: 6px; align-items: center; }
.ctrls .pos { font-variant-numeric: tabular-nums; font-size: 0.8667rem; color: var(--fg-dim); min-width: 56px; text-align: center; }
.flow-head .sum { grid-column: 1 / -1; margin: 0; color: var(--fg-dim); font-size: 0.9333rem; max-width: 95ch; }
.tests { grid-column: 1 / -1; display: grid; gap: 4px; font-size: 0.8667rem; padding: 8px 10px; background: var(--surface-2); border-radius: 6px; min-width: 0; }
.tests-t { font: 700 0.7rem var(--font-display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ok); }
.test { display: grid; gap: 1px; min-width: 0; }
.test a { word-break: break-all; }
.test span { color: var(--fg-dim); }
.flow-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, var(--seq-w, 1.15fr)) auto minmax(0, 1fr); }
/* draggable dividers */
.splitter { flex: 0 0 auto; width: 8px; margin: 0 -4px; position: relative; z-index: 5; cursor: col-resize; touch-action: none; background: none; outline: none; }
.splitter::before { content: ''; position: absolute; top: 0; bottom: 0; left: 3px; width: 2px; background: transparent; transition: background .15s; }
.splitter::after { content: ''; position: absolute; top: 50%; left: 1px; width: 6px; height: 36px; transform: translateY(-50%); border-radius: 3px; background: var(--line); }
.splitter:hover::before, .splitter:focus-visible::before, .splitter.dragging::before { background: var(--accent); }
.splitter:hover::after, .splitter:focus-visible::after, .splitter.dragging::after { background: var(--accent); }
body.resizing { cursor: col-resize; user-select: none; }
body.resizing iframe, body.resizing svg { pointer-events: none; }
.seq-wrap { overflow: auto; border-right: 1px solid var(--line); }
.seq-row { cursor: pointer; outline: none; }
.seq-row .rowbg { fill: transparent; }
.seq-row:hover .rowbg { fill: var(--surface-2); }
.seq-row:focus-visible .rowbg { fill: var(--surface-2); stroke: var(--accent); stroke-width: 2; }
.seq-row.cur .rowbg { fill: var(--back-soft); }
.seq-row.cur.res .rowbg { fill: var(--lay-soft); }
.seq-row.cur.async .rowbg { fill: var(--async-soft); }
.seq-num { font: 600 0.6667rem var(--font-mono); fill: var(--fg-dim); }
.seq-lbl { font-size: 0.7667rem; }
.seq-actor rect { fill: var(--surface); stroke: var(--line); }
.seq-actor text { font-weight: 700; font-size: 0.7667rem; }
.lifeline { stroke: var(--line); stroke-dasharray: 3 4; }
.arr-req { stroke: var(--back); fill: none; stroke-width: 1.6; }
.arr-res { stroke: var(--lay); fill: none; stroke-width: 1.6; stroke-dasharray: 5 3; }
.arr-async { stroke: var(--async); fill: none; stroke-width: 1.6; stroke-dasharray: 2 3; }
.arr-self { stroke: var(--note); fill: none; stroke-width: 1.4; }
.inspector { overflow-y: auto; padding: 16px 18px 40px; background: var(--surface); }
.step-kind { display: inline-flex; align-items: center; gap: 6px; font: 700 0.7rem var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; }
.k-req { background: var(--back-soft); color: var(--back); }
.k-res { background: var(--lay-soft); color: var(--lay); }
.k-async { background: var(--async-soft); color: var(--async); }
.k-self { background: var(--surface-2); color: var(--note); }
.inspector h3 { font: 700 1.2rem/1.25 var(--font-display); margin: 8px 0 2px; text-wrap: balance; word-break: break-word; }
.hop { font-size: 0.8667rem; color: var(--fg-dim); }
.hop b { color: var(--fg); }
.callline { font-family: var(--font-mono); font-size: 0.8333rem; background: var(--surface-2); padding: 6px 10px; border-radius: 6px; margin: 12px 0 4px; word-break: break-all; }
.callline .verb { font-weight: 600; color: var(--back); margin-right: 6px; }
.payloads { display: grid; gap: 10px; margin-top: 10px; }
.pl { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; min-width: 0; }
.pl-h { display: flex; align-items: center; justify-content: space-between; padding: 5px 10px; font: 700 0.7rem var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; }
.pl.req .pl-h { background: var(--back-soft); color: var(--back); }
.pl.res .pl-h { background: var(--lay-soft); color: var(--lay); }
.pl pre { margin: 0; padding: 10px 12px; overflow-x: auto; font: 0.8rem/1.5 var(--font-mono); background: var(--surface); }
.pl-h .acts { display: inline-flex; gap: 8px; align-items: center; }
.pl-h .trim { font: 600 0.7rem var(--font-body); letter-spacing: 0; text-transform: none; opacity: 0.85; }
.pl-h a.def { font: 600 0.73rem var(--font-body); letter-spacing: 0; text-transform: none; color: inherit; }
.pl .copy { font: 600 0.7333rem var(--font-body); letter-spacing: 0; text-transform: none; border: 1px solid currentColor; background: none; border-radius: 4px; padding: 0 6px; cursor: pointer; color: inherit; }
.j-k { color: var(--back); } .j-s { color: var(--ok); } .j-n { color: var(--lay); } .j-c { color: var(--fg-dim); font-style: italic; }
.unv { font-size: 0.8333rem; color: var(--fg-dim); font-style: italic; }
.stepnav { display: flex; justify-content: space-between; gap: 8px; margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); }
.stepnav .btn { max-width: 48%; text-align: left; }
.stepnav .btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- components ---------- */
#view-components { flex-direction: column; overflow-y: auto; }
.comp-wrap { padding: 16px clamp(16px, 2vw, 40px); width: 100%; }
.comp-tools { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.comp-tools input, .comp-tools select { padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.comp-tools input { flex: 1 1 280px; max-width: 420px; }
.comp-count { font-size: 0.8667rem; color: var(--fg-dim); }
.tbl-wrap { overflow-x: auto; margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.9333rem; }
th { text-align: left; font: 700 0.7rem var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-dim); padding: 10px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); }
td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr { cursor: pointer; outline: none; }
tbody tr:hover td, tbody tr:focus-visible td { background: var(--surface-2); }
td .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }
td .lay { display: block; font-size: 0.8rem; color: var(--fg-dim); }
.empty { padding: 20px; color: var(--fg-dim); }

/* ---------- about ---------- */
#view-about { overflow-y: auto; }
.prose { /* fluid type: 15px on phones, ~17px at 1440px, up to 22px on large monitors */
  flex: 1 1 auto; min-width: 0;
  font-size: clamp(15px, 0.55vw + 9px, 22px); line-height: 1.65; padding-block: clamp(20px, 2.5vw, 48px) 72px; padding-inline: clamp(16px, 3vw, 56px); }
.about-layout { display: grid; grid-template-columns: minmax(12em, 15em) minmax(0, 1fr); gap: clamp(20px, 3vw, 56px); align-items: start; }
.about-toc { position: sticky; top: 12px; display: flex; flex-direction: column; gap: 2px; font-size: 0.85em; border-left: 2px solid var(--line); padding-left: 2px; }

03c/b> deletes the API key named in the request body. \u003cb>Change password\u003c/b> checks the current password, validates the new one, deletes \u003ci>all\u003c/i> of the user's API keys and returns a fresh one. The reset-password flow does neither of the last two.","actors":["ui","http-api","user","security","db"],"steps":[{"from":"ui","to":"http-api","kind":"req","label":"Log out","protocol":"HTTP","call":{"verb":"POST","target":"/api/v1/user/logout"},"request":{"Authorization":"Bearer \u003capi-key-id>","apiKey":"\u003capi-key-id>"},"response":{},"requestSchema":{"ref":"bootzooka:backend/src/main/scala/com/softwaremill/bootzooka/user/UserApi.scala:109","quote":"case class Logout_IN(apiKey: String)"},"description":"The navbar sends its stored key in the body; the Bearer header carries a key too. The endpoint's description says it invalidates the used API key, but the handler uses the body value.","evidence":[{"ref":"bootzooka:ui/src/components/AppNavbar/index.tsx:68","quote":"logout({ body: { apiKey } })"},{"ref":"bootzooka:ui/src/api/apiComponents.ts:139","quote":"url: \"/user/logout\""},{"ref":"bootzooka:backend/src/main/scala/com/softwaremill/bootzooka/user/UserApi.scala:79","quote":"Logs out a user, invalidating the used API key."}]},{"from":"user","to":"security","kind":"req","label":"Authenticate the Bearer token","protocol":"in-process","payloadNote":"internal","description":"Logout is a secured endpoint, so the header key is checked first; the handler then ignores the authenticated key id (\u003ccode>_ =>\u003c/code>).","evidence":[{"ref":"bootzooka:backend/src/main/scala/com/softwaremill/bootzooka/user/UserApi.scala:37","quote":"authedEndpoint(logoutEndpoint).handle { _ => data =>"}]},{"from":"user","to":"db","kind":"req","label":"Delete the key from the body","protocol":"in-process","payloadNote":"sql","description":"The key id from the body is deleted. Nothing in these lines compares it with the key that authenticated the call.","evidence":[{"ref":" n:21\""}]},{"text":"CI generates the OpenAPI description, runs the tests, and builds the UI; the Docker image is published only from \u003ccode>master\u003c/code>.","evidence":[{"ref":"bootzooka:.github/workflows/bootzooka-ci.yml:44","quote":"sbt \"backend/generateOpenAPIDescription\""},{"ref":"bootzooka:.github/workflows/bootzooka-ci.yml:48","quote":"sbt testFull"},{"ref":"bootzooka:.github/workflows/bootzooka-ci.yml:58","quote":"if: github.ref == 'refs/heads/master'"}]}]},{"group":"Local development","items":[{"text":"The UI dev server listens on port \u003cb>8081\u003c/b>; the backend listens on port \u003cb>8080\u003c/b> by default (\u003ccode>API_PORT\u003c/code> / \u003ccode>PORT\u003c/code> override it).","evidence":[{"ref":"bootzooka:ui/vite.config.ts:16","quote":"port: 8081"},{"ref":"bootzooka:backend/src/main/resources/application.conf:5","quote":"port = 8080"}]},{"text":"In development the UI and the backend are different origins. The example UI env file sets the API base URL to \u003ccode>http://localhost:8080/api/v1\u003c/code>, and the backend installs Tapir's CORS interceptor with its default settings.","evidence":[{"ref":"bootzooka:ui/.env.example:1","quote":"http://localhost:8080/api/v1"},{"ref":"bootzooka:backend/src/main/scala/com/softwaremill/bootzooka/http/HttpApi.scala:47","quote":".corsInterceptor(CORSInterceptor.default[Identity])"}]},{"text":"Start scripts: \u003ccode>backend-start.sh\u003c/code> runs the backend under sbt with automatic restart and sets \u003ccode>OTEL_SDK_DISABLED=true\u003c/code>; \u003ccode>frontend-start.sh\u003c/code> runs \u003ccode>yarn start\u003c/code> in \u003ccode>ui/\u003c/code>.","evidence":[{"ref":"bootzooka:backend-start.sh:12","quote":"sbt --server \"~backend/reStart\""},{"ref":"bootzooka:backend-start.sh:4","quote":"export OTEL_SDK_DISABLED=true"},{"ref":"bootzooka:frontend-start.sh:4","quote":"yarn start"}]},{"text":"\u003ccode>docker-compose.yml\u003c/code> runs PostgreSQL with its port published on host port \u003cb>25432\u003c/b>, while the backend's default database port is 5432 (\u003ccode>SQL_PORT\u003c/code> overrides it).","evidence":[{"ref":"bootzooka:docker-compose.yml:24","quote":"- '25432:5432'"},{"ref":"bootzooka:backend/src/main/resources/application.conf:21","quote":"port = 5432"},{"ref":"bootzooka:backend/src/main/resources/application.conf:22","quote":"port = ${?SQL_PORT}"}]},{"text":"The same compose file starts a \u003ccode>grafana/otel-lgtm\u003c/code> container, and the backend container is pointed at its OTLP endpoint with environment variables; Grafana is on host port 3000.","evidence":[{"ref":"bootzooka:docker-compose.yml:32","quote":"image: 'grafana/otel-lgtm'"},{"ref":"bootzooka:docker-compose.yml:15","quote":"OTEL_EXPORTER_OTLP_ENDPOINT: 'http://observability:4318'"},{"ref":"bootzooka:docker-compose.yml:34","quote":"- '3000:3000'"}]}]},{"group":"Deployment to Kubernetes","items":[{"text":"A Helm chart named \u003ccode>bootzooka\u003c/code> lives in \u003ccode>helm/bootzooka\u003c/code>; it can install a Bitnami PostgreSQL sub-chart (\u003ccode>postgresql.enabled\u003c/code>).","evidence":[{"ref":"bootzooka:helm/bootzooka/Chart.yaml:4","quote":"name: bootzooka"},{"ref":"bootzooka:helm/bootzooka/Chart.yaml:26","quote":"condition: postgresql.enabled"}]},{"text":"The chart passes settings to the container as environment variables from a ConfigMap and a Secret, including SMTP, database and OpenTelemetry settings; OpenTelemetry is off unless \u003ccode>bootzooka.otel.enabled\u003c/code> is true.","evidence":[{"ref":"bootzooka:helm/bootzooka/templates/deployment.yaml:26","quote":"envFrom:"},{"ref":"bootzooka:helm/bootzooka/templates/configmap.yaml:19","quote":"OTEL_SDK_DISABLED: \"{{ not .Values.bootzooka.otel.enabled }}\""},{"ref":"bootzooka:helm/bootzooka/templates/configmap.yaml:7","quote":"SMTP_ENABLED"}]},{"text":"The chart has its own workflow, \u003ccode>bootzooka-helm-ci.yaml\u003c/code>, triggered by changes under \u003ccode>helm/\u003c/code> or \u003ccode>.github/\u003c/code> (pushes to \u003ccode>master\u003c/code>). When chart-testing finds a changed chart, it lints it, installs it on kind clusters for three Kubernetes versions, and checks that the generated chart docs have no diff.","evidence":[{"ref":"bootzooka:.github/workflows/bootzooka-helm-ci.yaml:6","quote":"- \"helm/**\""},{"ref":"bootzooka:.github/workflows/bootzooka-helm-ci.yaml:53","quote":"ct lint --config .github/helm-ct.yml"},{"ref":"bootzooka:.github/workflows/bootzooka-helm-ci.yaml:103","quote":"ct install --config .github/helm-ct.yml"},{"ref":"bootzooka:.github/workflows/bootzooka-helm-ci.yaml:124","quote":"run: git diff --exit-code"},{"ref":"bootzooka:.github/workflows/bootzooka-helm-ci.yaml:9","quote":"- master"},{"ref":"bootzooka:.github/workflows/bootzooka-helm-ci.yaml:43","quote":"name: Run chart-testing (list-changed)"}]},{"text":"In that workflow the job named \u003ci>Publish Helm Chart\u003c/i> (push events only) consists of a repository checkout step and no later steps.","evidence":[{"ref":"bootzooka:.github/workflows/bootzooka-helm-ci.yaml:133","quote":"name: Publish Helm Chart"},{"ref":"bootzooka:.github/workflows/bootzooka-helm-ci.yaml:138","quote":"uses: actions/checkout@v2"}]}]},{"group":"Conventions","items":[{"text":"The UI's API client is generated from the backend's OpenAPI description, not written by hand.","evidence":[{"ref":"bootzooka:ui/src/api/apiComponents.ts:2","quote":"Generated by @openapi-codegen"}]},{"text":"API endpoint errors are returned as JSON with an \u003ccode>error\u003c/code> field, and each failure type maps to an HTTP status.","evidence":[{"ref":"bootzooka:backend/src/main/scala/com/softwaremill/bootzooka/http/HttpApi.scala:45","quote":"all errors are formatted as JSON"},{"ref":"bootzooka:backend/src/main/scala/com/softwaremill/bootzooka/http/Http.scala:61","quote":"case class Error_OUT(error: String)"}]},{"text":"Passwords are hashed with Argon2id.","evidence":[{"ref":"bootzooka:backend/src/main/scala/com/softwaremill/bootzooka/user/UserModel.scala:70","quote":"com.password4j.types.Argon2.ID"}]},{"text":"Sensitive configuration values are wrapped so they print as \u003ccode>***\u003c/code> in logs.","evidence":[{"ref":"bootzooka:backend/src/main/scala/com/softwaremill/bootzooka/config/Sensitive.scala:7","quote":"override def toString: String = \"***\""}]}]}],"mapIntro":"\u003cdiv class=\"empty-hint\">\n  \u003ch2>How the system fits together\u003c/h2>\n  \u003cp>Select any box to see what it does, what it calls, what calls it and where that is in the code. Arrows leaving the selected box are blue; arrows coming in are pink.\u003c/p>\n  \u003cp>Open \u003cb>Flows\u003c/b> to step through how a request travels between components, with the request and response at each step.\u003c/p>\n\u003c/div>\n","about":"\u003ch2>How to read this map\u003c/h2>\n\u003cp>This page describes how the main components of the system fit together and how they talk to each other. Every component, connection and flow step has evidence: a link to the line of code that supports it, plus a short quote from that line. The date in the header is when the code was last checked.\u003c/p>\n\u003cp>When the code could not confirm something, it was left out. The map is deliberately smaller than the system: it covers what a newcomer needs, not every class or job.\u003c/p>\n\n\u003ch3>Reading a flow\u003c/h3>\n\u003cdiv class=\"legend-row\">\u003csvg width=\"46\" height=\"12\" aria-hidden=\"true\">\u003cline x1=\"2\" y1=\"6\" x2=\"40\" y2=\"6\" style=\"stroke:var(--back);stroke-width:2\"/>\u003cpath d=\"M38,2 L44,6 L38,10z\" style=\"fill:var(--back)\"/>\u003c/svg>\u003cspan>\u003cb>Request\u003c/b>: a call that waits for an answer (HTTP, gRPC, SQL and so on).\u003c/span>\u003c/div>\n\u003cdiv class=\"legend-row\">\u003csvg width=\"46\" height=\"12\" aria-hidden=\"true\">\u003cline x1=\"2\" y1=\"6\" x2=\"40\" y2=\"6\" style=\"stroke:var(--lay);stroke-width:2;stroke-dasharray:5 3\"/>\u003cpath d=\"M38,2 L44,6 L38,10z\" style=\"fill:var(--lay)\"/>\u003c/svg>\u003cspan>\u003cb>Response\u003c/b>: the answer to an earlier request.\u003c/span>\u003c/div>\n\u003cdiv class=\"legend-row\">\u003csvg width=\"46\" height=\"12\" aria-hidden=\"true\">\u003cline x1=\"2\" y1=\"6\" x2=\"40\" y2=\"6\" style=\"stroke:var(--async);stroke-width:2;stroke-dasharray:2 3\"/>\u003cpath d=\"M38,2 L44,6 L38,10z\" style=\"fill:var(--async)\"/>\u003c/svg>\u003cspan>\u003cb>Async\u003c/b>: a message on a queue or topic, or a call nobody waits for.\u003c/span>\u003c/div>\n\u003cp>Use the arrow keys to move between steps. Payload examples use the real field names from the code, with made-up values; \u003ccode>...\u003c/code> marks fields left out, and secrets are shown as placeholders such as \u003ccode>&lt;token&gt;\u003c/code>. A \u003cb>Full definition\u003c/b> link opens the class, schema or proto that defines the payload.\u003c/p>\n\n\u003ch3>Links you can share\u003c/h3>\n\u003cp>Every component, flow and step has its own address. Use \u003cb>Copy link\u003c/b>, or the address bar: \u003ccode>#node.&lt;id&gt;\u003c/code> opens a component, \u003ccode>#flow.&lt;id&gt;.&lt;step&gt;\u003c/code> opens a flow step and \u003ccode>#mapflow.&lt;id&gt;\u003c/code> shows a flow on the map.\u003c/p>\n\n\u003ch3>How this map is verified\u003c/h3>\n\u003cp>Each evidence item is a reference, \u003ccode>repo:path:line\u003c/code>, plus a quote copied from that line. The links open the code at the exact commit that was checked, so they keep working after the code moves on.\u003c/p>\n\u003cp>The map was built in three steps. First, claims were drafted from the code. Then other agents, which had not seen the draft, answered neutral questions about each claim from the code alone (Chain of Verification), and a separate reviewer tried to prove each claim wrong. Claims that did not survive were removed. Finally, a script checks every quote mechanically against each repository's default branch. Anyone can run that check again; it fails when the code changes under the map.\u003c/p>\n\u003cp>Links under \u003cb>Related links\u003c/b> point to documents, dashboards or tickets. They are not evidence and are not checked.\u003c/p>\n"};

/* ---------- views + routing ---------- */
function show(view, opts = {}) {

  t.onkeydown = e => { if (!['ArrowRight', 'ArrowLeft', 'Home', 'End'].includes(e.key)) return; e.preventDefault();
    const tabs = $$('.tab'), i = tabs.indexOf(t), n = e.key === 'Home' ? 0 : e.key === 'End' ? tabs.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;

});
function route(h) {

  let m = /^node\.([\w-]+)$/.exec(h); if (m && NODE[m[1]]) { show('map', { keepHash: true }); selectNode(m[1], { fromRoute: true }); return true; }

  if (m && D.flows.some(f => f.id === m[1])) { openFlow(m[1], m[2] ? +m[2] - 1 : 0); show('flows', { keepHash: true }); return true; }

window.addEventListener('hashchange', () => route(location.hash.slice(1)));

/* ---------- MAP ---------- */
const hiddenLayers = new Set();
let selNode = null, mapFlow = null, pos = {}, geom = {};
function drawChips() {

    `<button class="chip" type="button" aria-pressed="${!hiddenLayers.has(l.id)}" data-l="${l.id}"><span class="sw" style="background:${l.color}"></span>${esc(l.label)}</button>`).join('')
    + (hiddenLayers.size ? `<button class="btn ghost" type="button" id="showAll">Show all</button>` : '');
  $$('#chips .chip').forEach(c => c.onclick = () => { const l = c.dataset.l; hiddenLayers.has(l) ? hiddenLayers.delete(l) : hiddenLayers.add(l); drawChips(); drawMap(); });
  const sa = $('#showAll'); if (sa) sa.onclick = () => { hiddenLayers.clear(); drawChips(); drawMap(); };
}
function layoutMap(W) {
  // boxes grow on large screens: 1x up to 1440px wide, then in proportion, capped at 1.5x
  const s = W < 520 ? 1 : Math.min(1.5, Math.max(1, innerWidth / 1440));
  const PAD = W < 520 ? 10 : Math.round(18 * s), GX = W < 520 ? 10 : Math.round(14 * s), GY = Math.round(16 * s), HEAD = Math.round(30 * s), NH = Math.round(46 * s);
  let NW = Math.round(140 * s), cols = Math.max(2, Math.floor((W - 2 * PAD + GX) / (NW + GX)));
  if (cols <= 2) { cols = 2; NW = Math.floor((W - 2 * PAD - GX) / 2); }
  cols = Math.min(cols, 9);
  pos = {}; let y = 6; const rows = [];
  for (const l of D.layers) {

    const ns = D.nodes.filter(n => n.layer === l.id); if (!ns.length) continue;

      const rowW = inRow * (NW + GX) - GX; pos[n.id] = { x: (W - rowW) / 2 + c * (NW + GX), y: y + HEAD + r * (NH + GY) }; });

}
function edgePath(a, b) {

  if (Math.abs(pa.y - pb.y) < 5) { const my = pa.y - 22 * geom.s; return `M${x1},${pa.y} C${x1},${my} ${x2},${my} ${x2},${pb.y}`; }
  const [y1, y2] = pa.y < pb.y ? [pa.y + NH, pb.y] : [pa.y, pb.y + NH], my = (y1 + y2) / 2;

function drawMap() {
  const sc = $('#mapScroll'); if (!sc.clientWidth) return;
  const W = sc.clientWidth, rows = layoutMap(W), { NW, NH, H, s: k } = geom, svg = $('#mapSvg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('width', W); svg.setAttribute('height', H);
  const nb = new Set(); if (selNode) { nb.add(selNode); D.edges.forEach(e => { if (e.from === selNode) nb.add(e.to); if (e.to === selNode) nb.add(e.from); }); }
  const fp = mapFlow ? flowPath(D.flows.find(f => f.id === mapFlow)) : null;
  let s = `<defs>
    <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L8,4L0,8z" style="fill:var(--fg-dim)" opacity=".5"/></marker>
    <marker id="aho" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8z" style="fill:var(--back)"/></marker>
    <marker id="ahi" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8z" style="fill:var(--lay)"/></marker>
    <marker id="ahf" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8z" style="fill:var(--accent)"/></marker></defs>`;
  for (const r of rows) s += `<rect class="layer-band" x="4" y="${r.y}" width="${W - 8}" height="${r.h}" rx="10"/><text class="layer-label" x="${16 * k}" y="${r.y + 19 * k}" style="font-size:${(10.5 * k).toFixed(1)}px">${esc(r.l.label)}</text>`;
  D.edges.forEach((e, i) => {
    if (!pos[e.from] || !pos[e.to]) return;
    let cls = 'edge' + (e.condition ? ' cond' : ''), mk = 'ah';
    if (selNode) { if (e.from === selNode) { cls += ' out hi'; mk = 'aho'; } else if (e.to === selNode) { cls += ' in hi'; mk = 'ahi'; } else cls += ' dim'; }
    else if (fp) { if (fp.edges.has(i)) { cls += ' fp'; mk = 'ahf'; } else cls += ' dim'; }

    if (str) return colon ? `<span class="j-k">${str}</span>${colon}` : `<span class="j-s">${str}</span>`;
    if (num || kw) return `<span class="j-n">${m}</span>`;
    return m;
  });
}
function payloadBox(kind, title, body, schema) {
  if (body == null) return '';
  const txt = typeof body === 'string' ? body : JSON.stringify(body, null, 2);
  const trimmed = /\.\.\.|\u2026/.test(txt);
  const def = schema ? `<a class="def" href="${evHref(schema.ref)}" target="_blank" rel="noopener" data-ref="${esc(schema.ref)}" title="${esc(schema.ref)}">Full definition</a>` : '';
  return `<div class="pl ${kind}"><div class="pl-h"><span>${esc(title)}${trimmed ? ` <span class="trim" title="Fields marked ... are left out of this example">key fields only</span>` : ''}</span>
    <span class="acts">${def}<button class="copy" type="button" data-copy aria-label="Copy ${esc(title.toLowerCase())}">Copy</button></span></div><pre tabindex="0">${hlJson(txt)}</pre></div>`;
}
const NOTE = { 'no-body': 'No request body is sent.', sql: 'A database statement; there is no JSON payload.', internal: 'Nothing is sent over the wire in this step.',
  unknown: 'Payload shape not shown: its wire format is defined outside the code that was checked.',
  'class-fields': 'Key names are the fields of the message class. The exact wire format is set by a serialiser that was not checked.' };
const defLinks = st => { const l = [['Request', st.requestSchema], ['Response', st.responseSchema]].filter(x => x[1]);
  return l.length ? `<p class="unv">Definition: ${l.map(([n, e]) => `<a class="def" href="${evHref(e.ref)}" target="_blank" rel="noopener" data-ref="${esc(e.ref)}" title="${esc(e.ref)}">${n.toLowerCase()}</a>`).join(' &middot; ')}</p>` : ''; };
const KIND = { req: ['k-req', 'Request'], res: ['k-res', 'Response'], async: ['k-async', 'Async message'], self: ['k-self', 'Inside one service'] };
function renderStep(announceIt) {
  const st = flow.steps[stepIdx], n = flow.steps.length;
  $('#posT').textContent = `${stepIdx + 1} / ${n}`;
  $('#prevB').disabled = stepIdx === 0; $('#nextB').disabled = stepIdx === n - 1;
  const [kc, kl] = KIND[st.kind] || KIND.req;
  const hop = st.from === st.to ? `<div class="hop">Inside <b>${esc(actorLabel(st.from))}</b></div>`
    : `<div class="hop"><b>${esc(actorLabel(st.from))}</b> &rarr; <b>${esc(actorLabel(st.to))}</b>${st.protocol ? ` &middot; ${esc(st.protocol)}` : ''}</div>`;
  const call = st.call ? `<div class="callline">${st.call.verb ? `<span class="verb">${esc(st.call.verb)}</span>` : ''}${esc(st.call.target)}</div>` : '';
  const resOnly = st.kind === 'res';
  const pls = (st.request !== undefined || st.response !== undefined)
    ? `<div class="payloads">${payloadBox('req', st.requestTitle || 'Request', st.request, st.requestSchema)}${payloadBox('res', st.responseTitle || 'Response', st.response, resOnly ? (st.responseSchema || st.requestSchema) : st.responseSchema)}</div>`
      + (st.payloadNote && NOTE[st.payloadNote] ? `<p class="unv">${NOTE[st.payloadNote]}</p>` : '')
    : st.payloadNote && NOTE[st.payloadNote] ? `<p class="unv">${NOTE[st.payloadNote]}</p>${defLinks(st)}`
    : (st.kind === 'req' || st.kind === 'async' || st.kind === 'res') && !st.noPayload ? `<p class="unv">Payload shape not shown: it could not be confirmed from code.</p>${defLinks(st)}` : defLinks(st);
  // a request whose answer is a later step: say where it is
  let answerAt = -1;
  if (st.kind === 'req' && st.response === undefined) answerAt = flow.steps.findIndex((x, j) => j > stepIdx && x.kind === 'res' && x.from === st.to && x.to === st.from);
  const answerNote = answerAt > 0 ? `<p class="unv">The response is <button class="lnk" type="button" data-step="${answerAt}" style="background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font:inherit;text-decoration:underline">step ${answerAt + 1}: ${esc(flow.steps[answerAt].label)}</button>.</p>` : '';
  const prev = flow.steps[stepIdx - 1], next = flow.steps[stepIdx + 1];
  $('#inspector').innerHTML = `<span class="step-kind ${kc}">${kl}</span><h3 id="stepTitle">${esc(st.label)}</h3>${hop}<p>${st.description || ''}</p>${call}${pls}${answerNote}
    ${st.evidence && st.evidence.length ? `<div class="sec-t">Evidence</div>${evList(st.evidence)}` : ''}
    <div class="stepnav">${prev ? `<button class="btn" type="button" data-step="${stepIdx - 1}"><span>&#8592; ${esc(prev.label)}</span></button>` : '<span></span>'}
      ${next ? `<button class="btn primary" type="button" data-step="${stepIdx + 1}"><span>Next: ${esc(next.label)} &#8594;</span></button>` : `<span class="note">End of flow</span>`}</div>`;
  $$('#inspector [data-copy]').forEach(b => b.onclick = () => copyText(b.closest('.pl').querySelector('pre').innerText, b));
  $$('#inspector [data-step]').forEach(b => b.onclick = () => { stop(); go(+b.dataset.step); $('#inspector').scrollTop = 0; if (narrow()) showInspector(); });
  $('#inspector').scrollTop = 0;
  if ($('#view-flows').classList.contains('active')) setHash(`flow.${flow.id}.${stepIdx + 1}`);
  if (announceIt) announce(`Step ${stepIdx + 1} of ${n}: ${st.label}`);
}
document.addEventListener('keydown', e => {
  const tag = document.activeElement.tagName;
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(tag)) { e.preventDefault(); if (!$('#view-map').classList.contains('active')) show('map'); $('#mapSearch').focus(); return; }
  if (e.key === 'Escape' && $('#view-map').classList.contains('active') && selNode && tag !== 'INPUT') { const id = selNode; selectNode(null); $(`#mapSvg .node[data-id="${id}"]`)?.focus(); return; }
  if (e.key === 'Escape' && $('#view-map').classList.contains('active') && mapFlow && tag !== 'INPUT') { showFlowOnMap(null); return; }
  if (!$('#view-flows').classList.contains('active') || /INPUT|TEXTAREA|SELECT/.test(tag) || document.activeElement.classList.contains('tab') || document.activeElement.classList.contains('splitter')) return;
  const inSeq = !!document.activeElement.closest?.('#seqSvg');
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); stop(); go(stepIdx + 1, inSeq); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); stop(); go(stepIdx - 1, inSeq); }
});

/* ---------- COMPONENTS ---------- */
$('#compLayer').innerHTML = `<option value="">All layers</option>` + D.layers.map(l => `<option value="${l.id}">${esc(l.label)}</option>`).join('');
function drawComps() {
  const q = $('#compSearch').value.trim().toLowerCase(), lay = $('#compLayer').value;
  const rows = D.nodes.filter(n => (!lay || n.layer === lay) && (!q || [n.label, n.short, n.repo, strip(n.purpose), (n.exposes || []).join(' '), (n.stores || []).join(' '), LAYER[n.layer].label, D.edges.filter(e => e.from === n.id || e.to === n.id).map(e => e.protocol).join(' ')].join(' ').toLowerCase().includes(q)));
  $('#compCount').textContent = `Showing ${rows.length} of ${D.nodes.length}`;
  $('#compBody').innerHTML = rows.length ? rows.map(n => `<tr data-id="${n.id}" tabindex="0" aria-label="${esc(n.label)}, open on the map">
    <td><span class="sw" style="background:${LAYER[n.layer].color}"></span><b>${esc(n.label)}</b><span class="lay">${esc(LAYER[n.layer].label)}</span></td>
    <td class="mono">${n.repo ? repoLink(n.repo) : ''}</td><td>${n.purpose}</td>
    <td>${(n.exposes || []).map(x => `<span class="tag">${esc(x)}</span>`).join(' ')}</td><td>${(n.stores || []).map(x => `<span class="tag">${esc(x)}</span>`).join(' ')}</td></tr>`).join('')
    : `<tr><td colspan="5" class="empty">No component matches. Clear the filter to see all ${D.nodes.length}.</td></tr>`;
  $$('#compBody tr[data-id]').forEach(tr => {
    const open = () => { show('map'); selectNode(tr.dataset.id, { focusCard: true }); };
    tr.onclick = ev => { if (!ev.target.closest('a')) open(); };
    tr.onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); open(); } };
  });
}
$('#compSearch').oninput = drawComps; $('#compLayer').onchange = drawComps;

/* ---------- ABOUT ---------- */
function factsHtml() {
  return (D.facts || []).map(g => `<h3>${esc(g.group)}</h3><ul class="facts">${g.items.map(f => `<li>${f.text}${evList(f.evidence)}</li>`).join('')}</ul>`).join('');
}
function drawAbout() {
  const src = document.createElement('div'); src.innerHTML = D.about + factsHtml();
  const intro = document.createElement('div'); intro.className = 'about-intro';
  const secs = document.createElement('div'); secs.className = 'about-secs';
  let cur = null, i = 0;
  [...src.childNodes].forEach(node => {
    if (node.nodeType === 1 && node.tagName === 'H3') { cur = document.createElement('section'); cur.className = 'about-sec'; node.id = 'sec-' + i++; cur.setAttribute('aria-labelledby', node.id); secs.appendChild(cur); }
    (cur || intro).appendChild(node);
  });
  const hs = [...secs.querySelectorAll('h3')];
  const layout = document.createElement('div'); layout.className = 'about-layout';
  const toc = document.createElement('nav'); toc.className = 'about-toc'; toc.setAttribute('aria-label', 'On this page');
  toc.innerHTML = `<span class="toc-t">On this page</span>` + hs.map((h, k) => `<button type="button" data-sec="${k}">${esc(h.textContent)}</button>`).join('');
  const main = document.createElement('div'); main.className = 'about-main'; main.append(intro, secs);
  layout.append(toc, main);
  const about = $('#about'); about.innerHTML = ''; about.appendChild(layout);
  toc.querySelectorAll('button').forEach(b => b.onclick = () => {
    toc.querySelectorAll('button').forEach(x => x.removeAttribute('aria-current')); b.setAttribute('aria-current', 'true');
    $('#sec-' + b.dataset.sec).closest('.about-sec').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

/* ---------- draggable dividers ---------- */
function makeSplitter(el, o) {
  // o: { host, cssVar, key, def, min, max(hostWidth), measure: 'left'|'right', panel }
  const host = o.host, apply = px => { host.style.setProperty(o.cssVar, px == null ? '' : px + 'px'); sync(); };
  const cur = () => o.panel().getBoundingClientRect().width;
  const limits = () => { const hw = host.getBoundingClientRect().width; return [o.min, Math.max(o.min, Math.round(o.max(hw)))]; };
  const clamp = px => { const [lo, hi] = limits(); return Math.round(Math.min(hi, Math.max(lo, px))); };
  const sync = () => { const [lo, hi] = limits(); el.setAttribute('aria-valuemin', lo); el.setAttribute('aria-valuemax', hi); el.setAttribute('aria-valuenow', Math.round(cur())); };
  const save = px => store.set(o.key, px == null ? '' : String(px));
  const saved = parseInt(store.get(o.key), 10); if (saved > 0) host.style.setProperty(o.cssVar, saved + 'px');
  el.addEventListener('pointerdown', e => {
    if (e.button !== 0) return; e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add('dragging'); document.body.classList.add('resizing');
    const r = o.panel().getBoundingClientRect();
    const move = ev => { const px = o.measure === 'left' ? ev.clientX - r.left : r.right - ev.clientX; apply(clamp(px)); };
    const up = ev => { el.releasePointerCapture(ev.pointerId); el.classList.remove('dragging'); document.body.classList.remove('resizing');
      el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); save(Math.round(cur())); };
    el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  });
  el.addEventListener('dblclick', () => { apply(null); save(null); announce('Panel size reset'); });
  el.addEventListener('keydown', e => {
    const step = e.shiftKey ? 80 : 24, grow = o.measure === 'left' ? 1 : -1; let px = null;
    if (e.key === 'ArrowRight') px = cur() + step * grow; else if (e.key === 'ArrowLeft') px = cur() - step * grow;
    else if (e.key === 'Home') px = o.measure === 'left' ? limits()[0] : limits()[1]; else if (e.key === 'End') px = o.measure === 'left' ? limits()[1] : limits()[0];
    else if (e.key === 'Enter') { apply(null); save(null); e.preventDefault(); return; } else return;
    e.preventDefault(); e.stopPropagation(); px = clamp(px); apply(px); save(px);
  });
  new ResizeObserver(sync).observe(host); sync();
}
makeSplitter($('#splitMap'), { host: $('#view-map'), panel: () => $('#side'), cssVar: '--side-w', key: 'w-side', min: 280, max: hw => hw * 0.7, measure: 'right' });
makeSplitter($('#splitList'), { host: $('#view-flows'), panel: () => $('#flowlist'), cssVar: '--list-w', key: 'w-list', min: 170, max: hw => Math.min(480, hw * 0.4), measure: 'left' });
makeSplitter($('#splitSeq'), { host: $('#view-flows'), panel: () => $('#seqWrap'), cssVar: '--seq-w', key: 'w-seq', min: 300, max: hw => hw - $('#flowlist').getBoundingClientRect().width - 320, measure: 'left' });

/* ---------- boot ---------- */
drawAbout(); drawChips(); renderSide(); drawComps();
if (!D.flows.length) { $('#tab-flows').hidden = true; }
if (D.flows.length) openFlow(D.flows.some(f => f.id === store.get('flow')) ? store.get('flow') : (STARTER[0] || D.flows[0].id));
const h0 = location.hash.slice(1);
if (!route(h0)) show(VIEWS.includes(store.get('view')) ? store.get('view') : 'map');
})();
</script>
