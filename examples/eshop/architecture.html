<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>eShop Map</title>
<style>
/* Layout: one-line header with tabs; Map = search + layer filter over a width-fitted layered SVG, with a side card
   (a bottom sheet on phones); Flows = grouped flow list, header grid, fitted sequence lanes over a request/response inspector. */
:root {
  --bg: #f4f6f8; --surface: #ffffff; --surface-2: #e9edf2; --line: #d3dae3;
  --fg: #16202c; --fg-dim: #556373; --accent: #0f6b5c;
  --back: #1d5fa8; --back-soft: #dcecfb; --lay: #a8326a; --lay-soft: #fbe3ee;
  --async: #6e5510; --async-soft: #f6edcf; --note: #556373;
  --ok: #1f7a43; --warn: #9a6400; --shadow: 0 10px 30px rgba(22, 32, 44, 0.18);
  --font-display: 'Archivo', 'Arial Narrow', system-ui, sans-serif;
  --font-body: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e141b; --surface: #151d27; --surface-2: #1d2733; --line: #2b3746;
  --fg: #e3e9f0; --fg-dim: #94a3b4; --accent: #4cc3a9;
  --back: #6aaef0; --back-soft: #16304a; --lay: #ee7fae; --lay-soft: #42182c;
  --async: #e2c25e; --async-soft: #3a3115; --note: #94a3b4;
  --ok: #5fd08f; --warn: #e5b04c; --shadow: 0 10px 30px rgba(0, 0, 0, 0.55); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e141b; --surface: #151d27; --surface-2: #1d2733; --line: #2b3746;
  --fg: #e3e9f0; --fg-dim: #94a3b4; --accent: #4cc3a9;
  --back: #6aaef0; --back-soft: #16304a; --lay: #ee7fae; --lay-soft: #42182c;
  --async: #e2c25e; --async-soft: #3a3115; --note: #94a3b4;
  --ok: #5fd08f; --warn: #e5b04c; --shadow: 0 10px 30px rgba(0, 0, 0, 0.55); color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
html { font-size: clamp(15px, 0.35vw + 11px, 19px); } /* 15px phones, 16px at 1440, ~17.7px at 1920, 19px on 2560+ */
body { margin: 0; background: var(--bg); color: var(--fg); font: 1rem/1.5 var(--font-body); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, .mono { font-family: var(--font-mono); font-size: 0.86em; }
a { color: var(--accent); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: 8px; top: -40px; z-index: 50; background: var(--surface); padding: 6px 10px; border-radius: 6px; box-shadow: var(--shadow); }
.skip:focus { top: 8px; }

.app { display: flex; flex-direction: column; height: 100%; }

/* ---------- header ---------- */
.topbar { display: grid; grid-template-columns: auto 1fr auto; grid-template-areas: "brand tabs theme"; align-items: center; gap: 8px 16px;
  padding: 8px 16px; padding-top: calc(8px + env(safe-area-inset-top, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { grid-area: brand; display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { margin: 0; font: 800 1.2667rem/1.1 var(--font-display); white-space: nowrap; }
.verified { font-size: 0.8rem; color: var(--fg-dim); white-space: nowrap; }
.verified b { color: var(--ok); font-weight: 600; }
.tabs { grid-area: tabs; display: flex; gap: 2px; justify-content: flex-end; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 1px solid transparent; background: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; color: var(--fg-dim); font-weight: 600; white-space: nowrap; }
.tab:hover { color: var(--fg); background: var(--surface-2); }
.tab[aria-selected="true"] { color: var(--fg); border-color: var(--line); background: var(--bg); }
.themebtn { grid-area: theme; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 10px; cursor: pointer; color: var(--fg); font-size: 0.8667rem; line-height: 1.3; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
.btn.ghost { border-color: transparent; background: none; color: var(--fg-dim); }
.btn.ghost:hover { color: var(--fg); background: var(--surface-2); }

.view { flex: 1; min-height: 0; display: none; }
.view.active { display: flex; }

/* ---------- map ---------- */
#view-map { flex-direction: row; }
.map-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.map-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
.combo { position: relative; flex: 0 1 300px; min-width: 200px; }
.combo input { width: 100%; padding: 7px 10px 7px 30px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.combo svg.mag { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; stroke: var(--fg-dim); fill: none; pointer-events: none; }
.combo ul { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); max-height: 320px; overflow-y: auto; }
.combo li { padding: 6px 8px; border-radius: 5px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.combo li[aria-selected="true"], .combo li:hover { background: var(--surface-2); }
.combo li .sw { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; transform: translateY(1px); }
.combo li small { color: var(--fg-dim); }
.chips { display: flex; gap: 6px; flex: 1 1 400px; min-width: 0; flex-wrap: wrap; align-items: center; }
.chips-label { font: 700 0.7rem var(--font-display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-dim); margin-right: 2px; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 3px 10px; border-radius: 999px; cursor: pointer; font-size: 0.8333rem; display: inline-flex; align-items: center; gap: 6px; color: var(--fg-dim); white-space: nowrap; }
.chip .sw { width: 9px; height: 9px; border-radius: 2px; }
.chip[aria-pressed="true"] { color: var(--fg); border-color: var(--fg-dim); }
.chip[aria-pressed="false"] { text-decoration: line-through; opacity: 0.7; }
.map-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; }
.map-hint { padding: 6px 16px 0; font-size: 0.8333rem; color: var(--fg-dim); }
svg text { fill: var(--fg); font-family: var(--font-body); }
.layer-label { font: 700 0.7rem var(--font-display); letter-spacing: 0.12em; text-transform: uppercase; fill: var(--fg-dim); }
.layer-band { fill: var(--surface); stroke: var(--line); }
.node rect.box { fill: var(--surface); stroke-width: 1.5; }
.node { cursor: pointer; outline: none; }
.node text.nl { font-weight: 600; font-size: 0.8333rem; }
.node text.ns { font-size: 0.7rem; fill: var(--fg-dim); }
.node.dim { opacity: 0.22; }
.node.sel rect.box { stroke-width: 3; }
.node:focus-visible rect.box { stroke: var(--accent); stroke-width: 3; }
.node:hover rect.box { fill: var(--surface-2); }
.edge { fill: none; stroke: var(--fg-dim); stroke-width: 1; opacity: 0.09; transition: opacity .15s; }
.edge.hi { opacity: 0.85; stroke-width: 1.8; }
.edge.out.hi { stroke: var(--back); }
.edge.in.hi { stroke: var(--lay); }
.edge.dim { opacity: 0.03; }
.edge.focus { opacity: 1; stroke-width: 3.2; }
.edge.fp { stroke: var(--accent); opacity: 0.95; stroke-width: 2.4; }
.edge.cond { stroke-dasharray: 6 4; }
.node.cond .box { stroke-dasharray: 6 4; }
.cond-note { font-size: 0.82rem; color: var(--warn); }
.badge circle { fill: var(--accent); }
.badge text { fill: var(--surface); font-weight: 700; text-anchor: middle; }
.flowbanner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 0.9rem; }
.flowbanner b { font-family: var(--font-display); }
.flowbanner .note { flex: 1 1 260px; }
.stepslist { list-style: none; margin: 8px 0 0; padding: 0; counter-reset: s; display: grid; gap: 2px; }
.stepslist button { width: 100%; display: grid; grid-template-columns: 2em 1fr; gap: 0 6px; text-align: left; border: 0; background: none; padding: 6px 6px; border-radius: 6px; cursor: pointer; }
.stepslist button:hover { background: var(--surface-2); }
.stepslist .n { font: 600 0.75rem var(--font-mono); color: var(--fg-dim); padding-top: 2px; }
.stepslist .l { font-weight: 600; }
.stepslist .h { grid-column: 2; font-size: 0.8rem; color: var(--fg-dim); }
.qa { display: grid; gap: 8px; }
.qa .it { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: baseline; }
.qa .k { font: 600 0.7rem var(--font-mono); text-transform: uppercase; letter-spacing: 0.04em; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); color: var(--ok); }
.qa .nm { font-family: var(--font-mono); font-size: 0.85rem; font-weight: 600; word-break: break-all; }
.qa .nt { grid-column: 2; font-size: 0.82rem; color: var(--fg-dim); }
.qa .ev { grid-column: 2; margin: 0; }

.side { width: var(--side-w, 26rem); flex-shrink: 0; border-left: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding: 18px 18px 40px; }
.side-head { display: flex; align-items: flex-start; gap: 8px; }
.side-head > div { flex: 1; min-width: 0; }
.side h2 { font: 800 1.4rem/1.15 var(--font-display); margin: 0 0 4px; text-wrap: balance; }
.side .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 0.8333rem; color: var(--fg-dim); }
.layerpill { display: inline-flex; align-items: center; gap: 5px; }
.layerpill .sw { width: 9px; height: 9px; border-radius: 2px; }
.side p { margin: 10px 0; }
.sheet-close { display: none; }
.sec-t { font: 700 0.7rem var(--font-display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-dim); margin: 18px 0 6px; }
.rel { display: grid; grid-template-columns: auto 1fr; gap: 0 10px; font-size: 0.9rem; align-items: baseline; }
.rel .row { display: contents; }
.rel .p { font-family: var(--font-mono); font-size: 0.7333rem; padding: 1px 6px; border-radius: 4px; white-space: nowrap; margin-top: 4px; }
.rel .p.out { background: var(--back-soft); color: var(--back); }
.rel .p.in { background: var(--lay-soft); color: var(--lay); }
.rel button.lnk { background: none; border: 0; padding: 4px 0 0; cursor: pointer; color: var(--accent); font-weight: 600; text-align: left; }
.rel button.lnk:hover { text-decoration: underline; }
.rel .why { color: var(--fg-dim); font-size: 0.8333rem; grid-column: 2; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 0.7667rem; padding: 1px 7px; border-radius: 4px; background: var(--surface-2); color: var(--fg-dim); font-family: var(--font-mono); }
.links { margin: 4px 0 0; padding-left: 18px; }
.links li { margin: 2px 0; }
.facts { padding-left: 18px; }
.facts li { margin: 0 0 12px; }
.callout { border-left: 3px solid var(--warn); background: var(--surface-2); padding: 8px 12px; border-radius: 0 6px 6px 0; font-size: 0.9rem; margin: 10px 0; }
.note { font-size: 0.8667rem; color: var(--fg-dim); }
details.conn summary { cursor: pointer; }
details.conn .c { margin-top: 10px; font-size: 0.8333rem; }

.ev { font-size: 0.8rem; margin: 6px 0; }
.ev a { font-family: var(--font-mono); font-size: 0.7667rem; word-break: break-all; text-decoration: none; }
.ev a:hover { text-decoration: underline; }
.ev a .repo { color: var(--fg-dim); }
.ev q { display: block; quotes: none; font-family: var(--font-mono); font-size: 0.7667rem; color: var(--fg-dim); background: var(--surface-2); padding: 4px 8px; border-radius: 4px; margin-top: 2px; white-space: pre-wrap; word-break: break-word; }

.intro h2 { color: var(--fg); }

/* ---------- flows ---------- */
#view-flows { flex-direction: row; }
.flowlist { width: var(--list-w, 16.5rem); flex-shrink: 0; border-right: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding: 8px 10px 20px; }
.fl-group { font: 700 0.7rem var(--font-display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-dim); margin: 12px 10px 4px; }
.flowlist button { display: grid; grid-template-columns: 22px 1fr; column-gap: 6px; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.flowlist button:hover { background: var(--surface-2); }
.flowlist button[aria-current="true"] { background: var(--surface-2); box-shadow: inset 3px 0 0 var(--accent); }
.flowlist .num { grid-row: span 2; font: 700 0.7333rem var(--font-mono); color: var(--fg-dim); padding-top: 2px; }
.flowlist .ft { font-weight: 600; }
.flowlist .fs { font-size: 0.8333rem; color: var(--fg-dim); line-height: 1.35; }
.flowpick { display: none; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.flowpick select { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.flow-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.flow-head { padding: 12px 18px; background: var(--surface); border-bottom: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; align-items: center; }
.flow-head h2 { margin: 0; font: 800 1.3333rem/1.2 var(--font-display); text-wrap: balance; }
.ctrls { display: flex; gap: 6px; align-items: center; }
.ctrls .pos { font-variant-numeric: tabular-nums; font-size: 0.8667rem; color: var(--fg-dim); min-width: 56px; text-align: center; }
.flow-head .sum { grid-column: 1 / -1; margin: 0; color: var(--fg-dim); font-size: 0.9333rem; max-width: 95ch; }
.tests { grid-column: 1 / -1; display: grid; gap: 4px; font-size: 0.8667rem; padding: 8px 10px; background: var(--surface-2); border-radius: 6px; min-width: 0; }
.tests-t { font: 700 0.7rem var(--font-display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ok); }
.test { display: grid; gap: 1px; min-width: 0; }
.test a { word-break: break-all; }
.test span { color: var(--fg-dim); }
.flow-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, var(--seq-w, 1.15fr)) auto minmax(0, 1fr); }
/* draggable dividers */
.splitter { flex: 0 0 auto; width: 8px; margin: 0 -4px; position: relative; z-index: 5; cursor: col-resize; touch-action: none; background: none; outline: none; }
.splitter::before { content: ''; position: absolute; top: 0; bottom: 0; left: 3px; width: 2px; background: transparent; transition: background .15s; }
.splitter::after { content: ''; position: absolute; top: 50%; left: 1px; width: 6px; height: 36px; transform: translateY(-50%); border-radius: 3px; background: var(--line); }
.splitter:hover::before, .splitter:focus-visible::before, .splitter.dragging::before { background: var(--accent); }
.splitter:hover::after, .splitter:focus-visible::after, .splitter.dragging::after { background: var(--accent); }
body.resizing { cursor: col-resize; user-select: none; }
body.resizing iframe, body.resizing svg { pointer-events: none; }
.seq-wrap { overflow: auto; border-right: 1px solid var(--line); }
.seq-row { cursor: pointer; outline: none; }
.seq-row .rowbg { fill: transparent; }
.seq-row:hover .rowbg { fill: var(--surface-2); }
.seq-row:focus-visible .rowbg { fill: var(--surface-2); stroke: var(--accent); stroke-width: 2; }
.seq-row.cur .rowbg { fill: var(--back-soft); }
.seq-row.cur.res .rowbg { fill: var(--lay-soft); }
.seq-row.cur.async .rowbg { fill: var(--async-soft); }
.seq-num { font: 600 0.6667rem var(--font-mono); fill: var(--fg-dim); }
.seq-lbl { font-size: 0.7667rem; }
.seq-actor rect { fill: var(--surface); stroke: var(--line); }
.seq-actor text { font-weight: 700; font-size: 0.7667rem; }
.lifeline { stroke: var(--line); stroke-dasharray: 3 4; }
.arr-req { stroke: var(--back); fill: none; stroke-width: 1.6; }
.arr-res { stroke: var(--lay); fill: none; stroke-width: 1.6; stroke-dasharray: 5 3; }
.arr-async { stroke: var(--async); fill: none; stroke-width: 1.6; stroke-dasharray: 2 3; }
.arr-self { stroke: var(--note); fill: none; stroke-width: 1.4; }
.inspector { overflow-y: auto; padding: 16px 18px 40px; background: var(--surface); }
.step-kind { display: inline-flex; align-items: center; gap: 6px; font: 700 0.7rem var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; }
.k-req { background: var(--back-soft); color: var(--back); }
.k-res { background: var(--lay-soft); color: var(--lay); }
.k-async { background: var(--async-soft); color: var(--async); }
.k-self { background: var(--surface-2); color: var(--note); }
.inspector h3 { font: 700 1.2rem/1.25 var(--font-display); margin: 8px 0 2px; text-wrap: balance; word-break: break-word; }
.hop { font-size: 0.8667rem; color: var(--fg-dim); }
.hop b { color: var(--fg); }
.callline { font-family: var(--font-mono); font-size: 0.8333rem; background: var(--surface-2); padding: 6px 10px; border-radius: 6px; margin: 12px 0 4px; word-break: break-all; }
.callline .verb { font-weight: 600; color: var(--back); margin-right: 6px; }
.payloads { display: grid; gap: 10px; margin-top: 10px; }
.pl { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; min-width: 0; }
.pl-h { display: flex; align-items: center; justify-content: space-between; padding: 5px 10px; font: 700 0.7rem var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; }
.pl.req .pl-h { background: var(--back-soft); color: var(--back); }
.pl.res .pl-h { background: var(--lay-soft); color: var(--lay); }
.pl pre { margin: 0; padding: 10px 12px; overflow-x: auto; font: 0.8rem/1.5 var(--font-mono); background: var(--surface); }
.pl-h .acts { display: inline-flex; gap: 8px; align-items: center; }
.pl-h .trim { font: 600 0.7rem var(--font-body); letter-spacing: 0; text-transform: none; opacity: 0.85; }
.pl-h a.def { font: 600 0.73rem var(--font-body); letter-spacing: 0; text-transform: none; color: inherit; }
.pl .copy { font: 600 0.7333rem var(--font-body); letter-spacing: 0; text-transform: none; border: 1px solid currentColor; background: none; border-radius: 4px; padding: 0 6px; cursor: pointer; color: inherit; }
.j-k { color: var(--back); } .j-s { color: var(--ok); } .j-n { color: var(--lay); } .j-c { color: var(--fg-dim); font-style: italic; }
.unv { font-size: 0.8333rem; color: var(--fg-dim); font-style: italic; }
.stepnav { display: flex; justify-content: space-between; gap: 8px; margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); }
.stepnav .btn { max-width: 48%; text-align: left; }
.stepnav .btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- components ---------- */
#view-components { flex-direction: column; overflow-y: auto; }
.comp-wrap { padding: 16px clamp(16px, 2vw, 40px); width: 100%; }
.comp-tools { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.comp-tools input, .comp-tools select { padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.comp-tools input { flex: 1 1 280px; max-width: 420px; }
.comp-count { font-size: 0.8667rem; color: var(--fg-dim); }
.tbl-wrap { overflow-x: auto; margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.9333rem; }
th { text-align: left; font: 700 0.7rem var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-dim); padding: 10px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); }
td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr { cursor: pointer; outline: none; }
tbody tr:hover td, tbody tr:focus-visible td { background: var(--surface-2); }
td .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }
td .lay { display: block; font-size: 0.8rem; color: var(--fg-dim); }
.empty { padding: 20px; color: var(--fg-dim); }

/* ---------- about ---------- */
#view-about { overflow-y: auto; }
.prose { /* fluid type: 15px on phones, ~17px at 1440px, up to 22px on large monitors */
  flex: 1 1 auto; min-width: 0;
  font-size: clamp(15px, 0.55vw + 9px, 22px); line-height: 1.65; padding-block: clamp(20px, 2.5vw, 48px) 72px; padding-inline: clamp(16px, 3vw, 56px); }
.about-layout { display: grid; grid-template-columns: minmax(12em, 15em) minmax(0, 1fr); gap: clamp(20px, 3vw, 56px); align-items: start; }
.about-toc { position: sticky; top: 12px; display: flex; flex-direction: column; gap: 2px; font-size: 0.85em; border-left: 2px solid var(--line); padding-left: 2px; }

asketAsync(updatePayload);"},{"ref":"eShop:src/Basket.API/Grpc/BasketService.cs:41","quote":"ThrowNotAuthenticated();"}]},{"from":"basket-api","to":"redis","kind":"req","label":"Store the basket as one JSON string","protocol":"Redis","call":{"verb":"SET","target":"/basket/{userId}"},"payloadNote":"internal","evidence":[{"ref":"eShop:src/Basket.API/Repositories/RedisBasketRepository.cs:13","quote":"RedisKey BasketKeyPrefix = \"/basket/\"u8.ToArray();"},{"ref":"eShop:src/Basket.API/Repositories/RedisBasketRepository.cs:37","quote":"_database.StringSetAsync(GetBasketKey(basket.BuyerId), json)"}]},{"from":"basket-api","to":"webapp","kind":"res","label":"Return the saved basket","protocol":"gRPC","response":{"items":[{"product_id":1,"quantity":3}]},"evidence":[{"ref":"eShop:src/Basket.API/Grpc/BasketService.cs:56","quote":"return MapToCustomerBasketResponse(response);"}]}]},{"id":"checkout-and-order-status","title":"Check out and follow the order","tagline":"Order creation, stock check, payment, and the events in between","featured":true,"summary":"Checkout is one synchronous call to \u003cb>Ordering API\u003c/b>. Everything after that is asynchronous: each status change is an event on \u003cb>RabbitMQ\u003c/b> that another component reacts to, and Ordering publishes the new status back. Status path: \u003ccode>Submitted\u003c/code> (after the grace period) \u003ccode>AwaitingValidation\u003c/code>, \u003ccode>StockConfirmed\u003c/code>, \u003ccode>Paid\u003c/code>. Stock rejection and payment failure lead to \u003ccode>Cancelled\u003c/code>. WebApp itself only creates and lists orders; shipping and cancelling are the Ordering endpoints \u003ccode>PUT /api/orders/ship\u003c/code> and \u003ccode>/cancel\u003c/code>.","actors":["webapp","ordering-api","rabbitmq","basket-api","order-processor","postgres","catalog-api","payment-processor","webhooks-api"],"steps":[{"from":"webapp","to":"ordering-api","kind":"req","label":"Place the order","protocol":"HTTP","call":{"verb":"POST","target":"/api/orders"},"request":{"userId":"\u003cbuyer id>","userName":"\u003cname>","city":"\u003ccity>","street":"\u003cstreet>","state":"\u003cstate>","country":"\u003ccountry>","zipCode":"\u003czip>","cardNumber":"\u003ccard>","cardTypeId":1,"buyer":"\u003cbuyer id>","items":[{"productId":1,"productName":"\u003cname>","unitPrice":19.5,"quantity":2}],"...":"..."},"requestSchema":{"ref":"eShop:src/Ordering.API/Apis/OrdersApi.cs:171","quote":"public record CreateOrderRequest("},"description":"The \u003ccode>x-requestid\u003c/code> header carries a GUID that makes the command idempotent. Items are the basket lines enriched with catalog name and price. Field names are shown as sent: ASP.NET Core writes and reads JSON in camelCase, while the record declares them in PascalCase.","evidence":[{"ref":"eShop:src/WebApp/Services/BasketState.cs:107","quote":"await orderingService.CreateOrder(request, checkoutInfo.RequestId);"},{"ref":"eShop:src/WebApp/Services/OrderingService.cs:15","quote":"requestMessage.Headers.Add(\"x-requestid\""},{"ref":"eShop:src/Ordering.API/Apis/OrdersApi.cs:17","quote":"api.MapPost(\"/\", CreateOrderAsync);"}]},{"from":"ordering-api","to":"ordering-api","kind":"self","label":"Create the order as Submitted and queue OrderStarted and Submitted events","noPayload":true,"description":"The events are written to an event-log table in the same transaction and published after the transaction commits.","evidence":[{"ref":"eShop:src/Ordering.API/Application/Commands/CreateOrderCommandHandler.cs:33","quote":"await _orderingIntegrationEventService.AddAndSaveEventAsync(orderStartedIntegrationEvent);"},{"ref":"eShop:src/Ordering.Domain/AggregatesModel/OrderAggregate/Order.cs:57","quote":"OrderStatus = OrderStatus.Submitted;"},{"ref":"eShop:src/Ordering.API/Application/DomainEventHandlers/ValidateOrAddBuyerAggregateWhenOrderStartedDomainEventHandler.cs:51","quote":"await _orderingIntegrationEventService.AddAndSaveEventAsync(integrationEvent);"},{"ref":"eShop:src/Ordering.API/Application/Behaviors/TransactionBehavior.cs:52","quote":"await _orderingIntegrationEventService.PublishEventsThroughEventBusAsync(transactionId);"}]},{"from":"webapp","to":"basket-api","kind":"req","label":"Delete the basket (even if the order call failed)","protocol":"gRPC","call":{"verb":"rpc","target":"Basket/DeleteBasket"},"request":{},"description":"WebApp does not look at the order call's response before this call: \u003ccode>SendAsync\u003c/code> does not throw on an error status, so a rejected order still empties the basket. Ordering commits and publishes its events inside the same request, so the OrderStarted message below can be sent before this call is made; the diagram lists the WebApp call first.","evidence":[{"ref":"eShop:src/WebApp/Services/OrderingService.cs:17","quote":"return httpClient.SendAsync(requestMessage);"},{"ref":"eShop:src/WebApp/Services/BasketState.cs:108","quote":"await DeleteBasketAsync();"},{"ref":"eShop:src/WebApp/Services/BasketService.cs:17","quote":"basketClient.DeleteBasketAsync(new DeleteBasketRequest())"}]},{"from":"ordering-api","to":"rabbitmq","kind":"async","label":"Publish OrderStarted","protocol":"RabbitMQ","call":{"verb":"publish","target":"OrderStartedIntegrationEvent"},"request":{"UserId":"\u003cbuyer id>"},"requestSchema":{"ref":"eShop:src/Ordering.API/Application/IntegrationEvents/Events/OrderStartedIntegrationEvent.cs:6","quote":"public record OrderStartedIntegrationEvent"},"description":"The routing key is the event's class name. The message also carries \u003ccode>Id\u003c/code> and \u003ccode>CreationDate\u003c/code> from the base record.","evidence":[{"ref":"eShop:src/EventBusRabbitMQ/RabbitMQEventBus.cs:33","quote":"var routingKey = @event.GetType().Name;"},{"ref":"eShop:src/Ordering.API/Application/IntegrationEvents/OrderingIntegrationEventService.cs:24","quote":"await _eventBus.PublishAsync(logEvt.IntegrationEvent);"}]},{"from":"rabbitmq","to":"basket-api","kind":"async","label":"Basket deletes the buyer's basket (again)","protocol":"RabbitMQ","evidence":[{"ref":"eShop:src/Basket.API/Extensions/Extensions.cs:19","quote":".AddSubscription\u003cOrderStartedIntegrationEvent, OrderStartedIntegrationEventHandler>()"},{"ref":"eShop:src/Basket.API/IntegrationEvents/EventHandling/OrderStartedIntegrationEventHandler.cs:14","quote":"await repository.DeleteBasketAsync(@event.UserId);"}],"noPayload":true},{"from":"ordering-api","to":"rabbitmq","kind":"async","label":"Publish OrderStatusChangedToSubmitted","protocol":"RabbitMQ","call":{"verb":"publish","target":"OrderStatusChangedToSubmittedIntegrationEvent"},"description":"WebApp subscribes to this and every other order-status event and uses the buyer id in it to refresh that user's order page.","requestSchema":{"ref":"eShop:src/Ordering.API/Application/IntegrationEvents/Events/OrderStatusChangedTosubmittedIntegrationEvent.cs:3","quote":"public record OrderStatusChangedToSubmittedIntegrationEvent"},"evidence":[{"ref":"eShop:src/Ordering.API/Application/DomainEventHandlers/ValidateOrAddBuyerAggregateWhenOrderStartedDomainEventHandler.cs:50","quote":"new OrderStatusChangedToSubmittedIntegrationEvent("},{"ref":"eShop:src/WebApp/Extensions/Extensions.cs:50","quote":"eventBus.AddSubscription\u003cOrderStatusChangedToSubmittedIntegrationEvent"}]},{"from":"order-processor","to":"postgres","kind":"req","label":"Every CheckUpdateTime seconds: find orders still Submitted after the grace period","protocol":"PostgreSQL","payloadNote":"sql","description":"Defaults in appsettings: grace period 1 minute, poll every 30 seconds.","evidence":[{"ref":"eShop:src/OrderProcessor/Services/GracePeriodOrdersRepository.cs:27","quote":"\"OrderStatus\" = 'Submitted'"},{"ref":"eShop:src/OrderProcessor/appsettings.json:15","quote":"\"GracePeriodTime\": \"1\""},{"ref":"eShop:src/OrderProcessor/appsettings.json:16","quote":"\"CheckUpdateTime\": \"30\""}]},{"from":"order-processor","to":"rabbitmq","kind":"async","label":"Publish GracePeriodConfirmed for each such order","protocol":"RabbitMQ","call":{"verb":"publish","target":"GracePeriodConfirmedIntegrationEvent"},"requestSchema":{"ref":"eShop:src/OrderProcessor/Events/GracePeriodConfirmedIntegrationEvent.cs:5","quote":"public record GracePeriodConfirmedIntegrationEvent"},"evidence":[{"ref":"eShop:src/OrderProcessor/Services/GracePeriodManagerService.cs:56","quote":"new GracePeriodConfirmedIntegrationEvent(orderId)"},{"ref":"eShop:src/OrderProcessor/Services/GracePeriodManagerService.cs:60","quote":"await eventBus.PublishAsync(confirmGracePeriodEvent);"}]},{"from":"rabbitmq","to":"ordering-api","kind":"async","label":"Ordering moves the order to AwaitingValidation","protocol":"RabbitMQ","description":"The status only changes if the order is currently Submitted.","noPayload":true,"evidence":[{"ref":"eShop:src/Ordering.API/Application/IntegrationEvents/EventHandling/GracePeriodConfirmedIntegrationEventHandler.cs:19","quote":"new SetAwaitingValidationOrderStatusCommand(@event.OrderId)"},{"ref":"eShop:src/Ordering.Domain/AggregatesModel/OrderAggregate/Order.cs:101","quote":"if (OrderStatus == OrderStatus.Submitted)"}]},{"from":"ordering-api","to":"rabbitmq","kind":"async","label":"Publish OrderStatusChangedToAwaitingValidation (with the stock lines)","protocol":"RabbitMQ","call":{"verb":"publish","target":"OrderStatusChangedToAwaitingValidationIntegrationEvent"},"requestSchema":{"ref":"eShop:src/Ordering.API/Application/IntegrationEvents/Events/OrderStatusChangedToAwaitingValidationIntegrationEvent.cs:3","quote":"public record OrderStatusChangedToAwaitingValidationIntegrationEvent"},"evidence":[{"ref":"eShop:src/Ordering.API/Application/DomainEventHandlers/OrderStatusChangedToAwaitingValidationDomainEventHandler.cs:33","quote":"new OrderStatusChangedToAwaitingValidationIntegrationEvent(order.Id"}]},{"from":"rabbitmq","to":"catalog-api","kind":"async","label":"Catalog checks stock for every line","protocol":"RabbitMQ","description":"A line has stock when \u003ccode>AvailableStock\u003c/code> is at least the ordered units.","noPayload":true,"evidence":[{"ref":"eShop:src/Catalog.API/Extensions/Extensions.cs:32","quote":".AddSubscription\u003cOrderStatusChangedToAwaitingValidationIntegrationEvent"},{"ref":"eShop:src/Catalog.API/IntegrationEvents/EventHandling/OrderStatusChangedToAwaitingValidationIntegrationEventHandler.cs:20","quote":"var hasStock = catalogItem.AvailableStock >= orderStockItem.Units;"}]},{"from":"catalog-api","to":"rabbitmq","kind":"async","label":"Publish OrderStockConfirmed, or OrderStockRejected if any line lacks stock","protocol":"RabbitMQ","call":{"verb":"publish","target":"OrderStockConfirmedIntegrationEvent"},"request":{"OrderId":42},"requestSchema":{"ref":"eShop:src/Catalog.API/IntegrationEvents/Events/OrderStockConfirmedIntegrationEvent.cs:3","quote":"public record OrderStockConfirmedIntegrationEvent(int OrderId)"},"evidence":[{"ref":"eShop:src/Catalog.API/IntegrationEvents/EventHandling/OrderStatusChangedToAwaitingValidationIntegrationEventHandler.cs:28","quote":"new OrderStockRejectedIntegrationEvent(@event.OrderId, confirmedOrderStockItems)"},{"ref":"eShop:src/Catalog.API/IntegrationEvents/EventHandling/OrderStatusChangedToAwaitingValidationIntegrationEventHandler.cs:32","quote":"await catalogIntegrationEventService.PublishThroughEventBusAsync(confirmedIntegrationEvent);"}]},{"from":"rabbitmq","to":"ordering-api","kind":"async","label":"Ordering moves the order to StockConfirmed (a rejection is sent as a SetStockRejected command instead)","protocol":"RabbitMQ","description":"On rejection the order goes from AwaitingValidation to Cancelled, but that path raises no domain event, so no OrderStatusChangedToCancelled event is published for it.","noPayload":true,"evidence":[{"ref":"eShop:src/Ordering.API/Application/IntegrationEvents/EventHandling/OrderStockConfirmedIntegrationEventHandler.cs:12","quote":"new SetStockConfirmedOrderStatusCommand(@event.OrderId)"},{"ref":"eShop:src/Ordering.API/Application/IntegrationEvents/EventHandling/OrderStockRejectedIntegrationEventHandler.cs:15","quote":"new SetStockRejectedOrderStatusCommand(@event.OrderId, orderStockRejectedItems)"},{"ref":"eShop:src/Ordering.Domain/AggregatesModel/OrderAggregate/Order.cs:110","quote":"if (OrderStatus == OrderStatus.AwaitingValidation)"},{"ref":"eShop:src/Ordering.Domain/AggregatesModel/OrderAggregate/Order.cs:155","quote":"public void SetCancelledStatusWhenStockIsRejected("}]},{"from":"ordering-api","to":"rabbitmq","kind":"async","label":"Publish OrderStatusChangedToStockConfirmed","protocol":"RabbitMQ","call":{"verb":"publish","target":"OrderStatusChangedToStockConfirmedIntegrationEvent"},"request":{"OrderId":42,"OrderStatus":"StockConfirmed","BuyerName":"\u003cname>","BuyerIdentityGuid":"\u003cguid>"},"requestSchema":{"ref":"eShop:src/Ordering.API/Application/IntegrationEvents/Events/OrderStatusChangedToStockConfirmedIntegrationEvent.cs:3","quote":"public record OrderStatusChangedToStockConfirmedIntegrationEvent"},"evidence":[{"ref":"eShop:src/Ordering.API/Application/DomainEventHandlers/OrderStatusChangedToStockConfirmedDomainEventHandler.cs:30","quote":"new OrderStatusChangedToStockConfirmedIntegrationEvent(order.Id"}]},{"from":"rabbitmq","to":"payment-processor","kind":"async","label":"Payment processor picks it up","protocol":"RabbitMQ","noPayload":true,"evidence":[{"ref":"eShop:src/PaymentProcessor/Program.cs:6","quote":".AddSubscription\u003cOrderStatusChangedToStockConfirmedIntegrationEvent"}]},{"from":"payment-processor","to":"rabbitmq","kind":"async","label":"Publish OrderPaymentSucceeded, or OrderPaymentFailed when PaymentSucceeded is false","protocol":"RabbitMQ","call":{"verb":"publish","target":"OrderPaymentSucceededIntegrationEvent"},"request":{"OrderId":42},"requestSchema":{"ref":"eShop:src/PaymentProcessor/IntegrationEvents/Events/OrderPaymentSucceededIntegrationEvent.cs:3","quote":"public record OrderPaymentSucceededIntegrationEvent(int OrderId)"},"description":"No payment gateway is called; the outcome is the \u003ccode>PaymentSucceeded\u003c/code> option, \u003ccode>true\u003c/code> in appsettings.","evidence":[{"ref":"eShop:src/PaymentProcessor/IntegrationEvents/EventHandling/OrderStatusChangedToStockConfirmedIntegrationEventHandler.cs:21","quote":"if (options.CurrentValue.PaymentSucceeded)"},{"ref":"eShop:src/PaymentProcessor/IntegrationEvents/EventHandling/OrderStatusChangedToStockConfirmedIntegrationEventHandler.cs:27","quote":"new OrderPaymentFailedIntegrationEvent(@event.OrderId)"},{"ref":"eShop:src/PaymentProcessor/appsettings.json:15","quote":"\"PaymentSucceeded\": true"}]},{"from":"rabbitmq","to":"ordering-api","kind":"async","label":"Ordering marks the order Paid; on a payment failure it sends a cancel command instead","protocol":"RabbitMQ","noPayload":true,"evidence":[{"ref":"eShop:src/Ordering.API/Application/IntegrationEvents/EventHandling/OrderPaymentSucceededIntegrationEventHandler.cs:12","quote":"new SetPaidOrderStatusCommand(@event.OrderId)"},{"ref":"eShop:src/Ordering.API/Application/IntegrationEvents/EventHandling/OrderPaymentFailedIntegrationEventHandler.cs:12","quote":"new CancelOrderCommand(@event.OrderId)"},{"ref":"eShop:src/Ordering.Domain/AggregatesModel/OrderAggregate/Order.cs:121","quote":"if (OrderStatus == OrderStatus.StockConfirmed)"}]},{"from":"ordering-api","to":"rabbitmq","kind":"async","label":"Publish OrderStatusChangedToPaid","protocol":"RabbitMQ","call":{"verb":"publish","target":"OrderStatusChangedToPaidIntegrationEvent"},"request":{"OrderId":42,"OrderStatus":"Paid","BuyerName":"\u003cname>","BuyerIdentityGuid":"\u003cguid>","OrderStockItems":[{"...":"..."}]},"requestSchema":{"ref":"eShop:src/Ordering.API/Application/IntegrationEvents/Events/OrderStatusChangedToPaidIntegrationEvent.cs:3","quote":"public record OrderStatusChangedToPaidIntegrationEvent"},"evidence":[{"ref":"eShop:src/Ordering.API/Application/DomainEventHandlers/OrderStatusChangedToPaidDomainEventHandler.cs:32","quote":"new OrderStatusChangedToPaidIntegrationEvent("}]},{"from":"rabbitmq","to":"catalog-api","kind":"async","label":"Catalog removes the ordered units from stock","protocol":"RabbitMQ","noPayload":true,"evidence":[{"ref":"eShop:src/Catalog.API/Extensions/Extensions.cs:33","quote":".AddSubscription\u003cOrderStatusChangedToPaidIntegrationEvent"},{"ref":"eShop:src/Catalog.API/IntegrationEvents/EventHandling/OrderStatusChangedToPaidIntegrationEventHandler.cs:17","quote":"catalogItem?.RemoveStock(orderStockItem.Units);"}]},{"from":"rabbitmq","to":"webhooks-api","kind":"async","label":"Webhooks API looks up OrderPaid subscribers and POSTs them the event","protocol":"RabbitMQ","noPayload":true,"evidence":[{"ref":"eShop:src/Webhooks.API/Extensions/Extensions.cs:23","quote":"AddSubscription\u003cOrderStatusChangedToPaidIntegrationEvent"},{"ref":"eShop:src/Webhooks.API/IntegrationEvents/OrderStatusChangedToPaidIntegrationEventHandler.cs:10","quote":"GetSubscriptionsOfType(WebhookType.OrderPaid)"}]}]}],"facts":[{"group":"How it runs","items":[{"text":"The whole system is started from one Aspire AppHost project that declares every service, database and the broker.","evidence":[{"ref":"eShop:src/eShop.AppHost/AppHost.cs:4","quote":"DistributedApplication.CreateBuilder(args)"}]},{"text":"WebApp finds Catalog by Aspire service name (\u003ccode>catalog-api\u003c/code>), resolved through service discovery that \u003ccode>AddServiceDefaults\u003c/code> turns on (Basket and Order processor use the basic variant without it).","evidence":[{"ref":"eShop:src/eShop.ServiceDefaults/Extensions.cs:20","quote":"builder.Services.AddServiceDiscovery();"},{"ref":"eShop:src/WebApp/Extensions/Extensions.cs:34","quote":"new(\"https+http://catalog-api\")"}]},{"text":"Projects that call \u003ccode>AddServiceDefaults\u003c/code> get the standard resilience handler on their HTTP clients by default.","evidence":[{"ref":"eShop:src/eShop.ServiceDefaults/Extensions.cs:25","quote":"http.AddStandardResilienceHandler();"}]},{"text":"ServiceDefaults maps \u003ccode>/health\u003c/code> and \u003ccode>/alive\u003c/code> only when the environment is Development.","evidence":[{"ref":"eShop:src/eShop.ServiceDefaults/Extensions.cs:115","quote":"if (app.Environment.IsDevelopment())"},{"ref":"eShop:src/eShop.ServiceDefaults/Extensions.cs:118","quote":"app.MapHealthChecks(\"/health\");"}]},{"text":"Catalog, Identity, Ordering and Webhooks migrate their own database at startup. A code comment in Catalog calls this a development convenience that should not be in production.","evidence":[{"ref":"eShop:src/Catalog.API/Extensions/Extensions.cs:23","quote":"This is done for development ease but shouldn't be here in production"},{"ref":"eShop:src/Identity.API/Program.cs:12","quote":"builder.Services.AddMigration\u003cApplicationDbContext, UsersSeed>();"},{"ref":"eShop:src/Catalog.API/Extensions/Extensions.cs:24","quote":"builder.Services.AddMigration\u003cCatalogContext, CatalogContextSeed>();"},{"ref":"eShop:src/Ordering.API/Extensions/Extensions.cs:21","quote":"services.AddMigration\u003cOrderingContext, OrderingContextSeed>();"},{"ref":"eShop:src/Webhooks.API/Extensions/Extensions.cs:12","quote":"builder.Services.AddMigration\u003cWebhooksContext>();"}]},{"text":"Order processor waits for Ordering API to be ready because Ordering holds the EF migrations.","evidence":[{"ref":"eShop:src/eShop.AppHost/AppHost.cs:51","quote":".WaitFor(orderingApi); // wait for the orderingApi to be ready because that contains the EF migrations"}]}]},{"group":"How events work","items":[{"text":"Every event is published to one direct exchange and the routing key is the event class name, so a consumer subscribes by the class name of the event.","evidence":[{"ref":"eShop:src/EventBusRabbitMQ/RabbitMQEventBus.cs:33","quote":"var routingKey = @event.GetType().Name;"},{"ref":"eShop:src/EventBusRabbitMQ/RabbitMQEventBus.cs:47","quote":"await channel.ExchangeDeclareAsync("}]},{"text":"A consumer acknowledges every message, including when its handler threw: the exception is logged and the message is removed from the queue. A code comment says a real app should use a dead-letter exchange. A failed handler therefore loses that event.","evidence":[{"ref":"eShop:src/EventBusRabbitMQ/RabbitMQEventBus.cs:172","quote":"logger.LogWarning(ex, \"Error Processing message"},{"ref":"eShop:src/EventBusRabbitMQ/RabbitMQEventBus.cs:177","quote":"// Even on exception we take the message off the queue."},{"ref":"eShop:src/EventBusRabbitMQ/RabbitMQEventBus.cs:180","quote":"await _consumerChannel.BasicAckAsync(eventArgs.DeliveryTag"}]},{"text":"If publishing an outbox event fails, Ordering and Catalog mark it as \u003ccode>PublishedFailed\u003c/code> and carry on. The only read of pending events takes entries still \u003ccode>NotPublished\u003c/code> for the current transaction, so a failed event is not published again by this code.","evidence":[{"ref":"eShop:src/Ordering.API/Application/IntegrationEvents/OrderingIntegrationEventService.cs:31","quote":"await _eventLogService.MarkEventAsFailedAsync(logEvt.EventId);"},{"ref":"eShop:src/Catalog.API/IntegrationEvents/CatalogIntegrationEventService.cs:24","quote":"await integrationEventLogService.MarkEventAsFailedAsync(evt.Id);"},{"ref":"eShop:src/IntegrationEventLogEF/Services/IntegrationEventLogService.cs:22","quote":"e.TransactionId == transactionId && e.State == EventStateEnum.NotPublished"}]},{"text":"Ordering and Catalog save the event to an integration-event log in the same database transaction as the data change, then publish it (a transactional outbox).","evidence":[{"ref":"eShop:src/Ordering.API/Application/IntegrationEvents/OrderingIntegrationEventService.cs:40","quote":"await _eventLogService.SaveEventAsync(evt, _orderingContext.GetCurrentTransaction());"},{"ref":"eShop:src/Catalog.API/IntegrationEvents/CatalogIntegrationEventService.cs:38","quote":"await integrationEventLogService.SaveEventAsync(evt, catalogContext.Database.CurrentTransaction);"}]}]},{"group":"Conventions inside Ordering API","items":[{"text":"Ordering API uses MediatR for commands, with logging, validation and transaction behaviours wrapped around every command.","evidence":[{"ref":"eShop:src/Ordering.API/Extensions/Extensions.cs:35","quote":"services.AddMediatR(cfg =>"},{"ref":"eShop:src/Ordering.API/Extensions/Extensions.cs:41","quote":"cfg.AddOpenBehavior(typeof(TransactionBehavior\u003c,>));"}]},{"text":"Creating an order is idempotent on the \u003ccode>x-requestid\u003c/code> header: a duplicate request is ignored and reported as success.","evidence":[{"ref":"eShop:src/Ordering.API/Application/Commands/CreateOrderCommandHandler.cs:67","quote":"protected override bool CreateResultForDuplicateRequest()"},{"ref":"eShop:src/Ordering.API/Application/Commands/CreateOrderCommandHandler.cs:69","quote":"return true; // Ignore duplicate requests for creating order."}]}]},{"group":"Build and CI","items":[{"text":"Pull requests build and test the server solution filter \u003ccode>eShop.Web.slnf\u003c/code> on Ubuntu.","evidence":[{"ref":"eShop:.github/workflows/pr-validation.yml:27","quote":"run: dotnet build eShop.Web.slnf"},{"ref":"eShop:.github/workflows/pr-validation.yml:29","quote":"run: dotnet test --solution eShop.Web.slnf"}]},{"text":"The MAUI client app is built and tested in a separate Windows workflow.","evidence":[{"ref":"eShop:.github/workflows/pr-validation-maui.yml:39","quote":"run: dotnet build src/ClientApp/ClientApp.csproj"}]},{"text":"Browser end-to-end tests run with Playwright in CI.","evidence":[{"ref":"eShop:.github/workflows/playwright.yml:34","quote":"run: npm run test:e2e"}]}]}],"mapIntro":"\u003cdiv class=\"empty-hint\">\n  \u003ch2>How the system fits together\u003c/h2>\n  \u003cp>Select any box to see what it does, what it calls, what calls it and where that is in the code. Arrows leaving the selected box are blue; arrows coming in are pink.\u003c/p>\n  \u003cp>Open \u003cb>Flows\u003c/b> to step through how a request travels between components, with the request and response at each step.\u003c/p>\n\u003c/div>\n","about":"\u003ch2>How to read this map\u003c/h2>\n\u003cp>This page describes how the main components of the system fit together and how they talk to each other. Every component, connection and flow step has evidence: a link to the line of code that supports it, plus a short quote from that line. The date in the header is when the code was last checked.\u003c/p>\n\u003cp>When the code could not confirm something, it was left out. The map is deliberately smaller than the system: it covers what a newcomer needs, not every class or job.\u003c/p>\n\n\u003ch3>Reading a flow\u003c/h3>\n\u003cdiv class=\"legend-row\">\u003csvg width=\"46\" height=\"12\" aria-hidden=\"true\">\u003cline x1=\"2\" y1=\"6\" x2=\"40\" y2=\"6\" style=\"stroke:var(--back);stroke-width:2\"/>\u003cpath d=\"M38,2 L44,6 L38,10z\" style=\"fill:var(--back)\"/>\u003c/svg>\u003cspan>\u003cb>Request\u003c/b>: a call that waits for an answer (HTTP, gRPC, SQL and so on).\u003c/span>\u003c/div>\n\u003cdiv class=\"legend-row\">\u003csvg width=\"46\" height=\"12\" aria-hidden=\"true\">\u003cline x1=\"2\" y1=\"6\" x2=\"40\" y2=\"6\" style=\"stroke:var(--lay);stroke-width:2;stroke-dasharray:5 3\"/>\u003cpath d=\"M38,2 L44,6 L38,10z\" style=\"fill:var(--lay)\"/>\u003c/svg>\u003cspan>\u003cb>Response\u003c/b>: the answer to an earlier request.\u003c/span>\u003c/div>\n\u003cdiv class=\"legend-row\">\u003csvg width=\"46\" height=\"12\" aria-hidden=\"true\">\u003cline x1=\"2\" y1=\"6\" x2=\"40\" y2=\"6\" style=\"stroke:var(--async);stroke-width:2;stroke-dasharray:2 3\"/>\u003cpath d=\"M38,2 L44,6 L38,10z\" style=\"fill:var(--async)\"/>\u003c/svg>\u003cspan>\u003cb>Async\u003c/b>: a message on a queue or topic, or a call nobody waits for.\u003c/span>\u003c/div>\n\u003cp>Use the arrow keys to move between steps. Payload examples use the real field names from the code, with made-up values; \u003ccode>...\u003c/code> marks fields left out, and secrets are shown as placeholders such as \u003ccode>&lt;token&gt;\u003c/code>. A \u003cb>Full definition\u003c/b> link opens the class, schema or proto that defines the payload.\u003c/p>\n\n\u003ch3>Links you can share\u003c/h3>\n\u003cp>Every component, flow and step has its own address. Use \u003cb>Copy link\u003c/b>, or the address bar: \u003ccode>#node.&lt;id&gt;\u003c/code> opens a component, \u003ccode>#flow.&lt;id&gt;.&lt;step&gt;\u003c/code> opens a flow step and \u003ccode>#mapflow.&lt;id&gt;\u003c/code> shows a flow on the map.\u003c/p>\n\n\u003ch3>How this map is verified\u003c/h3>\n\u003cp>Each evidence item is a reference, \u003ccode>repo:path:line\u003c/code>, plus a quote copied from that line. The links open the code at the exact commit that was checked, so they keep working after the code moves on.\u003c/p>\n\u003cp>The map was built in three steps. First, claims were drafted from the code. Then other agents, which had not seen the draft, answered neutral questions about each claim from the code alone (Chain of Verification), and a separate reviewer tried to prove each claim wrong. Claims that did not survive were removed. Finally, a script checks every quote mechanically against each repository's default branch. Anyone can run that check again; it fails when the code changes under the map.\u003c/p>\n\u003cp>Links under \u003cb>Related links\u003c/b> point to documents, dashboards or tickets. They are not evidence and are not checked.\u003c/p>\n"};

/* ---------- MAP ---------- */
const hiddenLayers = new Set();

function layoutMap(W) {

function edgePath(a, b) {

  if (Math.abs(pa.y - pb.y) < 5) { const my = pa.y - 22 * geom.s; return `M${x1},${pa.y} C${x1},${my} ${x2},${my} ${x2},${pb.y}`; }

function drawMap() {

  });
  const fsL = 12.5 * k, fsS = 10.5 * k, fl = `600 ${fsL}px "Source Sans 3", system-ui, sans-serif`, fs = `${fsS}px "Source Sans 3", system-ui, sans-serif`, tx = 13 * k;
  for (const n of D.nodes) {

      ${ord ? `<g class="badge" aria-hidden="true"><circle cx="${p.x + NW - 2}" cy="${p.y + 2}" r="${br}"/><text x="${p.x + NW - 2}" y="${p.y + 2 + 4 * k}" style="font-size:${(11 * k).toFixed(1)}px">${ord}</text></g>` : ''}</g>`;
  }

    g.onclick = ev => { ev.stopPropagation(); selectNode(g.dataset.id === selNode && !narrow() ? null : g.dataset.id); };
    g.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); selectNode(g.dataset.id, { focusCard: true }); } };

}
/* which connections and components a flow uses; a step with no direct connection is drawn through a component marked gateway: true */
const GATEWAYS = D.nodes.filter(n => n.gateway).map(n => n.id);
function flowPath(f) {
  const idx = new Map(D.edges.map((e, i) => [e.from + '>' + e.to, i])), edges = new Set(), via = new Set(), order = new Map();
  const add = (a, b) => { if (idx.has(a + '>' + b)) { edges.add(idx.get(a + '>' + b)); return true; }
    for (const g of GATEWAYS) if (idx.has(a + '>' + g) && idx.has(g + '>' + b)) { edges.add(idx.get(a + '>' + g)); edges.add(idx.get(g + '>' + b)); via.add(g); return true; }
    return false; };

    [st.from, st.to].forEach(a => { if (!order.has(a)) order.set(a, order.size + 1); });

}

  b.hidden = !f || !!selNode; if (b.hidden) return;

function highlightEdge(i, on) { const p = $(`#mapSvg path[data-e="${i}"]`); if (p) p.classList.toggle('focus', on); }
function relRows(n, dir) {

      ${next ? `<button class="btn primary" type="button" data-step="${stepIdx + 1}"><span>Next: ${esc(next.label)} &#8594;</span></button>` : `<span class="note">End of flow</span>`}</div>`;
  $$('#inspector [data-copy]').forEach(b => b.onclick = () => copyText(b.closest('.pl').querySelector('pre').innerText, b));
  $$('#inspector [data-step]').forEach(b => b.onclick = () => { stop(); go(+b.dataset.step); $('#inspector').scrollTop = 0; if (narrow()) showInspector(); });
  $('#inspector').scrollTop = 0;
  if ($('#view-flows').classList.contains('active')) setHash(`flow.${flow.id}.${stepIdx + 1}`);
  if (announceIt) announce(`Step ${stepIdx + 1} of ${n}: ${st.label}`);
}
document.addEventListener('keydown', e => {
  const tag = document.activeElement.tagName;
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(tag)) { e.preventDefault(); if (!$('#view-map').classList.contains('active')) show('map'); $('#mapSearch').focus(); return; }
  if (e.key === 'Escape' && $('#view-map').classList.contains('active') && selNode && tag !== 'INPUT') { const id = selNode; selectNode(null); $(`#mapSvg .node[data-id="${id}"]`)?.focus(); return; }
  if (e.key === 'Escape' && $('#view-map').classList.contains('active') && mapFlow && tag !== 'INPUT') { showFlowOnMap(null); return; }
  if (!$('#view-flows').classList.contains('active') || /INPUT|TEXTAREA|SELECT/.test(tag) || document.activeElement.classList.contains('tab') || document.activeElement.classList.contains('splitter')) return;
  const inSeq = !!document.activeElement.closest?.('#seqSvg');
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); stop(); go(stepIdx + 1, inSeq); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); stop(); go(stepIdx - 1, inSeq); }
});

/* ---------- COMPONENTS ---------- */
$('#compLayer').innerHTML = `<option value="">All layers</option>` + D.layers.map(l => `<option value="${l.id}">${esc(l.label)}</option>`).join('');
function drawComps() {
  const q = $('#compSearch').value.trim().toLowerCase(), lay = $('#compLayer').value;
  const rows = D.nodes.filter(n => (!lay || n.layer === lay) && (!q || [n.label, n.short, n.repo, strip(n.purpose), (n.exposes || []).join(' '), (n.stores || []).join(' '), LAYER[n.layer].label, D.edges.filter(e => e.from === n.id || e.to === n.id).map(e => e.protocol).join(' ')].join(' ').toLowerCase().includes(q)));
  $('#compCount').textContent = `Showing ${rows.length} of ${D.nodes.length}`;
  $('#compBody').innerHTML = rows.length ? rows.map(n => `<tr data-id="${n.id}" tabindex="0" aria-label="${esc(n.label)}, open on the map">
    <td><span class="sw" style="background:${LAYER[n.layer].color}"></span><b>${esc(n.label)}</b><span class="lay">${esc(LAYER[n.layer].label)}</span></td>
    <td class="mono">${n.repo ? repoLink(n.repo) : ''}</td><td>${n.purpose}</td>
    <td>${(n.exposes || []).map(x => `<span class="tag">${esc(x)}</span>`).join(' ')}</td><td>${(n.stores || []).map(x => `<span class="tag">${esc(x)}</span>`).join(' ')}</td></tr>`).join('')
    : `<tr><td colspan="5" class="empty">No component matches. Clear the filter to see all ${D.nodes.length}.</td></tr>`;
  $$('#compBody tr[data-id]').forEach(tr => {
    const open = () => { show('map'); selectNode(tr.dataset.id, { focusCard: true }); };
    tr.onclick = ev => { if (!ev.target.closest('a')) open(); };
    tr.onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); open(); } };
  });
}
$('#compSearch').oninput = drawComps; $('#compLayer').onchange = drawComps;

/* ---------- ABOUT ---------- */
function factsHtml() {
  return (D.facts || []).map(g => `<h3>${esc(g.group)}</h3><ul class="facts">${g.items.map(f => `<li>${f.text}${evList(f.evidence)}</li>`).join('')}</ul>`).join('');
}
function drawAbout() {
  const src = document.createElement('div'); src.innerHTML = D.about + factsHtml();
  const intro = document.createElement('div'); intro.className = 'about-intro';
  const secs = document.createElement('div'); secs.className = 'about-secs';
  let cur = null, i = 0;
  [...src.childNodes].forEach(node => {
    if (node.nodeType === 1 && node.tagName === 'H3') { cur = document.createElement('section'); cur.className = 'about-sec'; node.id = 'sec-' + i++; cur.setAttribute('aria-labelledby', node.id); secs.appendChild(cur); }
    (cur || intro).appendChild(node);
  });
  const hs = [...secs.querySelectorAll('h3')];
  const layout = document.createElement('div'); layout.className = 'about-layout';
  const toc = document.createElement('nav'); toc.className = 'about-toc'; toc.setAttribute('aria-label', 'On this page');
  toc.innerHTML = `<span class="toc-t">On this page</span>` + hs.map((h, k) => `<button type="button" data-sec="${k}">${esc(h.textContent)}</button>`).join('');
  const main = document.createElement('div'); main.className = 'about-main'; main.append(intro, secs);
  layout.append(toc, main);
  const about = $('#about'); about.innerHTML = ''; about.appendChild(layout);
  toc.querySelectorAll('button').forEach(b => b.onclick = () => {
    toc.querySelectorAll('button').forEach(x => x.removeAttribute('aria-current')); b.setAttribute('aria-current', 'true');
    $('#sec-' + b.dataset.sec).closest('.about-sec').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

/* ---------- draggable dividers ---------- */
function makeSplitter(el, o) {
  // o: { host, cssVar, key, def, min, max(hostWidth), measure: 'left'|'right', panel }
  const host = o.host, apply = px => { host.style.setProperty(o.cssVar, px == null ? '' : px + 'px'); sync(); };
  const cur = () => o.panel().getBoundingClientRect().width;
  const limits = () => { const hw = host.getBoundingClientRect().width; return [o.min, Math.max(o.min, Math.round(o.max(hw)))]; };
  const clamp = px => { const [lo, hi] = limits(); return Math.round(Math.min(hi, Math.max(lo, px))); };
  const sync = () => { const [lo, hi] = limits(); el.setAttribute('aria-valuemin', lo); el.setAttribute('aria-valuemax', hi); el.setAttribute('aria-valuenow', Math.round(cur())); };
  const save = px => store.set(o.key, px == null ? '' : String(px));
  const saved = parseInt(store.get(o.key), 10); if (saved > 0) host.style.setProperty(o.cssVar, saved + 'px');
  el.addEventListener('pointerdown', e => {
    if (e.button !== 0) return; e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add('dragging'); document.body.classList.add('resizing');
    const r = o.panel().getBoundingClientRect();
    const move = ev => { const px = o.measure === 'left' ? ev.clientX - r.left : r.right - ev.clientX; apply(clamp(px)); };
    const up = ev => { el.releasePointerCapture(ev.pointerId); el.classList.remove('dragging'); document.body.classList.remove('resizing');
      el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); save(Math.round(cur())); };
    el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  });
  el.addEventListener('dblclick', () => { apply(null); save(null); announce('Panel size reset'); });
  el.addEventListener('keydown', e => {
    const step = e.shiftKey ? 80 : 24, grow = o.measure === 'left' ? 1 : -1; let px = null;
    if (e.key === 'ArrowRight') px = cur() + step * grow; else if (e.key === 'ArrowLeft') px = cur() - step * grow;
    else if (e.key === 'Home') px = o.measure === 'left' ? limits()[0] : limits()[1]; else if (e.key === 'End') px = o.measure === 'left' ? limits()[1] : limits()[0];
    else if (e.key === 'Enter') { apply(null); save(null); e.preventDefault(); return; } else return;
    e.preventDefault(); e.stopPropagation(); px = clamp(px); apply(px); save(px);
  });
  new ResizeObserver(sync).observe(host); sync();
}
makeSplitter($('#splitMap'), { host: $('#view-map'), panel: () => $('#side'), cssVar: '--side-w', key: 'w-side', min: 280, max: hw => hw * 0.7, measure: 'right' });
makeSplitter($('#splitList'), { host: $('#view-flows'), panel: () => $('#flowlist'), cssVar: '--list-w', key: 'w-list', min: 170, max: hw => Math.min(480, hw * 0.4), measure: 'left' });
makeSplitter($('#splitSeq'), { host: $('#view-flows'), panel: () => $('#seqWrap'), cssVar: '--seq-w', key: 'w-seq', min: 300, max: hw => hw - $('#flowlist').getBoundingClientRect().width - 320, measure: 'left' });

/* ---------- boot ---------- */
drawAbout(); drawChips(); renderSide(); drawComps();
if (!D.flows.length) { $('#tab-flows').hidden = true; }
if (D.flows.length) openFlow(D.flows.some(f => f.id === store.get('flow')) ? store.get('flow') : (STARTER[0] || D.flows[0].id));
const h0 = location.hash.slice(1);
if (!route(h0)) show(VIEWS.includes(store.get('view')) ? store.get('view') : 'map');
})();
</script>
