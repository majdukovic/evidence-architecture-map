# Add to .gitlab-ci.yml, run it from a pipeline schedule. MAP_READ_TOKEN: a project or group access token with
# read_repository on every cited repo, stored as a masked CI/CD variable.
verify-architecture-map:
  image: node:22
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
  script:
    - git config --global url."https://oauth2:${MAP_READ_TOKEN}@gitlab.com/".insteadOf "https://gitlab.com/"
    - git clone -q --depth 1 https://github.com/majdukovic/evidence-architecture-map tools/evidence-architecture-map
    - bash tools/evidence-architecture-map/skills/build-architecture-map/scripts/verify-ci.sh docs/architecture-map
